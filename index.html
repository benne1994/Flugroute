<script>
// ═══════════════════════════════════════════════════════════════
//  CESIUM SETUP
// ═══════════════════════════════════════════════════════════════
Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiI5ZTI3MDRmMy1mYjg5LTRjNmYtYjBmZC1kZDQxN2NlNzVkZDEiLCJpZCI6Mjk3NzA1LCJpYXQiOjE3NDU5MzE5MTh9.svRycz7t606srY9WbWiWUaLB2hJpycWmo835Dy-VWtw';

const viewer = new Cesium.Viewer('cesiumContainer', {
  sceneMode: Cesium.SceneMode.SCENE3D,
  animation:false, timeline:false, baseLayerPicker:true,
  fullscreenButton:false, homeButton:false, sceneModePicker:false,
  geocoder:false, navigationHelpButton:false,
  infoBox:false, selectionIndicator:false,
  terrain: Cesium.Terrain.fromWorldTerrain()
});
const scene = viewer.scene;
const camera = viewer.camera;
const ctrl = scene.screenSpaceCameraController;

// Sensible camera controls
ctrl.rotateRate  = 0.25;
ctrl.zoomRate    = 0.35;
ctrl.tiltRate    = 0.15;
ctrl.minimumZoomDistance = 50;

// Fly to user location on load
navigator.geolocation.getCurrentPosition(pos => {
  camera.flyTo({
    destination: Cesium.Cartesian3.fromDegrees(pos.coords.longitude, pos.coords.latitude, (pos.coords.altitude||0)+1200),
    duration: 6
  });
}, ()=>{});

// ═══════════════════════════════════════════════════════════════
//  CONSTANTS & STATE
// ═══════════════════════════════════════════════════════════════
const ALT_OFFSET = 50;

// Camera modes: 0=behind(chase), 1=cockpit, 2=free/overview
const CAM_MODES   = ['Hinter-Ansicht','Cockpit','Freie Ansicht'];
const CAM_OFFSETS = [
  new Cesium.Cartesian3(0, -280, 80),   // behind
  new Cesium.Cartesian3(0,   8, 2),     // cockpit
  null                                   // free
];
let camMode = 0;

let fullCoords     = [];
let animationIndex = 0;
let isPlaying      = false;
let speedFactor    = 1;
let trailSeconds   = 3000;
let followEnabled  = true;
let is3D           = false;
let startAltitude  = null;
let originalFileName    = null;
let originalKmlContent  = null;
let cutModeActive       = false;
let userManuallyMoved   = false;
let manualMoveTimer     = null;

let movingEntity   = null;
let ghostPolyline  = null; // full route dim
let activePolyline = null; // trail bright

let mainChart = null;
let rafId     = null;
let lastRafTs = null;
let secAccum  = 0;

// Smooth camera lerp
let camTargetPos   = null;
let camTargetHeading = null;

// Quad shadow trail
let quadEntities = [];
const MAX_QUADS  = 50;
let lastQuadIdx  = -1;

// ═══════════════════════════════════════════════════════════════
//  POLYLINES
// ═══════════════════════════════════════════════════════════════
// Ghost = full route, always visible but dim
ghostPolyline = viewer.entities.add({
  polyline:{
    positions: new Cesium.CallbackProperty(()=>{
      if(!fullCoords.length) return [];
      return Cesium.Cartesian3.fromDegreesArrayHeights(
        fullCoords.flatMap(p=>[p.lon,p.lat,p.alt+ALT_OFFSET])
      );
    },false),
    width:2,
    material:new Cesium.PolylineDashMaterialProperty({
      color: Cesium.Color.fromCssColorString('#4fa3ff').withAlpha(0.18),
      dashLength:12
    })
  }
});

// Active trail
activePolyline = viewer.entities.add({
  polyline:{
    positions: new Cesium.CallbackProperty(()=>{
      if(!fullCoords.length||animationIndex<1) return [];
      const t=fullCoords[animationIndex]?.seconds??0;
      const minT=t-trailSeconds;
      const trail=[];
      for(let i=animationIndex;i>=0;i--){
        if(fullCoords[i].seconds<minT) break;
        trail.unshift(fullCoords[i]);
      }
      return Cesium.Cartesian3.fromDegreesArrayHeights(
        trail.flatMap(p=>[p.lon,p.lat,p.alt+ALT_OFFSET])
      );
    },false),
    width:5,
    material:new Cesium.PolylineGlowMaterialProperty({
      glowPower:0.18,
      taperPower:0.5,
      color:Cesium.Color.fromCssColorString('#4fa3ff').withAlpha(1.0)
    })
  }
});

// ═══════════════════════════════════════════════════════════════
//  KML PARSER
// ═══════════════════════════════════════════════════════════════
function parseKml(text){
  const lines=text.split(/\r?\n/);
  const raw=[];
  let t=null;
  for(let line of lines){
    line=line.trim();
    if(line.startsWith('<name>')){
      const parts=line.replace(/<\/?name>/g,'').trim().split(':').map(Number);
      if(parts.length>=2){ const[h,m,s=0]=parts; t=h*3600+m*60+s; }
    }
    if(line.includes('<coordinates>')&&t!==null){
      const cs=line.substring(line.indexOf('>')+1,line.indexOf('</coordinates>')).trim();
      const[lon,lat,alt]=cs.split(',').map(Number);
      if(!isNaN(lon)&&!isNaN(lat)&&!isNaN(alt)) raw.push({seconds:t,lon,lat,alt});
    }
  }
  if(!raw.length) return[];

  const coords=[];
  const STEPS=10;
  for(let i=0;i<raw.length;i++){
    if(i===0){coords.push({...raw[0],distCum:0});continue;}
    const prev=raw[i-1],curr=raw[i];
    for(let s=1;s<=STEPS;s++){
      const f=s/STEPS;
      const lon=prev.lon+(curr.lon-prev.lon)*f;
      const lat=prev.lat+(curr.lat-prev.lat)*f;
      const alt=prev.alt+(curr.alt-prev.alt)*f;
      const seconds=prev.seconds+(curr.seconds-prev.seconds)*f;
      const last=coords[coords.length-1];
      const dx=(lon-last.lon)*111320*Math.cos(lat*Math.PI/180);
      const dy=(lat-last.lat)*111320;
      coords.push({seconds,lon,lat,alt,distCum:last.distCum+Math.sqrt(dx*dx+dy*dy)});
    }
  }
  return coords;
}

// ═══════════════════════════════════════════════════════════════
//  LOAD KML
// ═══════════════════════════════════════════════════════════════
function loadKmlText(text,filename){
  originalKmlContent=text; originalFileName=filename;
  fullCoords=parseKml(text);
  if(!fullCoords.length){alert('Keine gültigen Koordinaten.');return;}
  animationIndex=0; startAltitude=null;
  isPlaying=false; lastRafTs=null; secAccum=0;
  cancelAnimationFrame(rafId);
  document.getElementById('togglePlayBtn').textContent='▶';
  quadEntities.forEach(e=>viewer.entities.remove(e));
  quadEntities=[]; lastQuadIdx=-1;
  updatePoint(0);
  buildChart();
  camera.flyTo({
    destination:Cesium.Cartesian3.fromDegrees(fullCoords[0].lon,fullCoords[0].lat,fullCoords[0].alt+2500),
    duration:2.5
  });
  showKeyHint();
}

async function loadFromServer(url){
  showLoading(true);
  try{
    const res=await fetch(url);
    if(!res.ok) throw new Error('HTTP '+res.status);
    loadKmlText(await res.text(),url.split('/').pop());
  }catch(e){alert('Fehler: '+e.message);}
  showLoading(false);
}

// ═══════════════════════════════════════════════════════════════
//  UPDATE POINT
// ═══════════════════════════════════════════════════════════════
function updatePoint(idx){
  animationIndex=idx;
  const p=fullCoords[idx];
  const pos=Cesium.Cartesian3.fromDegrees(p.lon,p.lat,p.alt+ALT_OFFSET);

  // Moving entity
  if(!movingEntity){
    movingEntity=viewer.entities.add({
      position:pos,
      orientation:makeOrientation(),
      model:{
        uri:'https://benne1994.github.io/Flugroute/falcon_flying.glb',
        scale:0.9, minimumPixelSize:32, maximumScale:250
      }
    });
  } else {
    movingEntity.position=new Cesium.ConstantPositionProperty(pos);
  }

  // Camera follow (only if not manually moved)
  if(followEnabled&&!userManuallyMoved) applyFollow(p,pos);

  // HUD
  if(startAltitude===null) startAltitude=p.alt;
  let speed=0,vario=0;
  if(idx>0){
    const prev=fullCoords[idx-1];
    const dt=p.seconds-prev.seconds;
    if(dt>0){
      const dx=(p.lon-prev.lon)*111320*Math.cos(p.lat*Math.PI/180);
      const dy=(p.lat-prev.lat)*111320;
      speed=(Math.sqrt(dx*dx+dy*dy)/dt)*3.6;
      vario=(p.alt-prev.alt)/dt;
    }
  }
  document.getElementById('infoSpeed').textContent    =speed.toFixed(1)+' km/h';
  document.getElementById('infoAlt').textContent      =p.alt.toFixed(1)+' m';
  document.getElementById('infoRelAlt').textContent   =(p.alt-startAltitude).toFixed(1)+' m';
  document.getElementById('infoDistance').textContent =((p.distCum||0)/1000).toFixed(2)+' km';
  document.getElementById('infoTime').textContent     =fmtTime(p.seconds);
  const vEl=document.getElementById('infoVario');
  vEl.textContent=vario.toFixed(2)+' m/s';
  vEl.className='hud-val'+(vario>0.2?' up':vario<-0.2?' dn':'');

  // Progress bar
  const pct=fullCoords.length>1?(idx/(fullCoords.length-1))*100:0;
  document.getElementById('progressFill').style.width=pct+'%';
  document.getElementById('progressThumb').style.left=pct+'%';
}

// ═══════════════════════════════════════════════════════════════
//  ORIENTATION (falcon direction)
// ═══════════════════════════════════════════════════════════════
function makeOrientation(){
  return new Cesium.CallbackProperty(()=>{
    if(animationIndex<1) return Cesium.Quaternion.IDENTITY;
    const prev=fullCoords[Math.max(0,animationIndex-1)];
    const curr=fullCoords[animationIndex];
    const from=Cesium.Cartesian3.fromDegrees(prev.lon,prev.lat,prev.alt+ALT_OFFSET);
    const to  =Cesium.Cartesian3.fromDegrees(curr.lon,curr.lat,curr.alt+ALT_OFFSET);
    const dir =Cesium.Cartesian3.subtract(to,from,new Cesium.Cartesian3());
    if(Cesium.Cartesian3.magnitude(dir)<1e-6) return Cesium.Quaternion.IDENTITY;
    Cesium.Cartesian3.normalize(dir,dir);
    const up   =Cesium.Cartesian3.UNIT_Z;
    const right=Cesium.Cartesian3.normalize(Cesium.Cartesian3.cross(up,dir,new Cesium.Cartesian3()),new Cesium.Cartesian3());
    const tup  =Cesium.Cartesian3.cross(dir,right,new Cesium.Cartesian3());
    const rot  =new Cesium.Matrix3();
    Cesium.Matrix3.setColumn(rot,0,right,rot);
    Cesium.Matrix3.setColumn(rot,1,tup,rot);
    Cesium.Matrix3.setColumn(rot,2,dir,rot);
    const base=Cesium.Quaternion.fromRotationMatrix(rot);
    const xR  =Cesium.Quaternion.fromAxisAngle(Cesium.Cartesian3.UNIT_X,Cesium.Math.toRadians(-90));
    return Cesium.Quaternion.multiply(base,xR,new Cesium.Quaternion());
  },false);
}

// ═══════════════════════════════════════════════════════════════
//  CAMERA FOLLOW – smooth lerp
// ═══════════════════════════════════════════════════════════════
function applyFollow(p,pos){
  if(scene.mode===Cesium.SceneMode.SCENE2D){
    const h=camera.positionCartographic.height;
    camera.setView({destination:Cesium.Cartesian3.fromDegrees(p.lon,p.lat,h)});
    return;
  }
  if(camMode===2) return; // free mode – don't touch camera

  const offset=CAM_OFFSETS[camMode];
  const tf=Cesium.Transforms.eastNorthUpToFixedFrame(pos);

  if(camMode===0){
    // Behind: smooth lerp toward target
    camera.lookAtTransform(tf,offset);
  } else if(camMode===1){
    // Cockpit: camera sits inside the model
    camera.lookAtTransform(tf,offset);
  }
}

function stopFollow(){
  camera.lookAtTransform(Cesium.Matrix4.IDENTITY);
}

// Detect manual camera movement → temporarily disable follow
scene.preUpdate.addEventListener(()=>{
  if(!followEnabled||camMode===2) return;
  // CesiumJS sets isMoving on the controller when user drags
});

// Listen for user input to pause follow
['mousedown','touchstart','pointerdown'].forEach(ev=>{
  viewer.scene.canvas.addEventListener(ev,()=>{
    if(!followEnabled) return;
    userManuallyMoved=true;
    clearTimeout(manualMoveTimer);
    // Re-engage follow after 3s of no input
    manualMoveTimer=setTimeout(()=>{
      userManuallyMoved=false;
      if(followEnabled&&fullCoords.length)
        applyFollow(fullCoords[animationIndex],
          Cesium.Cartesian3.fromDegrees(fullCoords[animationIndex].lon,
            fullCoords[animationIndex].lat,fullCoords[animationIndex].alt+ALT_OFFSET));
    },3000);
  },{passive:true});
});

// ═══════════════════════════════════════════════════════════════
//  CAMERA MODE CYCLE
// ═══════════════════════════════════════════════════════════════
function cycleCamMode(){
  camMode=(camMode+1)%3;
  if(camMode===2){
    stopFollow();
    ctrl.enableInputs=true;
  } else {
    ctrl.enableInputs=true;
  }
  showCamBadge(CAM_MODES[camMode]);
  if(fullCoords.length&&camMode!==2) {
    userManuallyMoved=false;
    applyFollow(fullCoords[animationIndex],
      Cesium.Cartesian3.fromDegrees(fullCoords[animationIndex].lon,
        fullCoords[animationIndex].lat,fullCoords[animationIndex].alt+ALT_OFFSET));
  }
}

function showCamBadge(text){
  const b=document.getElementById('camBadge');
  b.textContent=text; b.classList.add('show');
  setTimeout(()=>b.classList.remove('show'),2200);
}

// ═══════════════════════════════════════════════════════════════
//  VERTICAL QUADS
// ═══════════════════════════════════════════════════════════════
async function maybeAddQuad(idx){
  if(idx<=0||idx===lastQuadIdx) return;
  lastQuadIdx=idx;
  const p1=fullCoords[idx-1],p2=fullCoords[idx];
  const cartos=[
    Cesium.Cartographic.fromDegrees(p1.lon,p1.lat),
    Cesium.Cartographic.fromDegrees(p2.lon,p2.lat)
  ];
  try{
    const up=await Cesium.sampleTerrainMostDetailed(viewer.terrainProvider,cartos);
    const g1=up[0].height??0, g2=up[1].height??0;
    const top1  =Cesium.Cartesian3.fromDegrees(p1.lon,p1.lat,p1.alt+ALT_OFFSET);
    const top2  =Cesium.Cartesian3.fromDegrees(p2.lon,p2.lat,p2.alt+ALT_OFFSET);
    const gnd1  =Cesium.Cartesian3.fromDegrees(p1.lon,p1.lat,g1);
    const gnd2  =Cesium.Cartesian3.fromDegrees(p2.lon,p2.lat,g2);
    const ent=viewer.entities.add({
      polygon:{
        hierarchy:new Cesium.PolygonHierarchy([top1,top2,gnd2,gnd1]),
        material:Cesium.Color.fromCssColorString('#4fa3ff').withAlpha(0.10),
        perPositionHeight:true
      }
    });
    quadEntities.push(ent);
    quadEntities.forEach((e,i)=>{
      const a=0.04+(i/quadEntities.length)*0.18;
      e.polygon.material=Cesium.Color.fromCssColorString('#4fa3ff').withAlpha(a);
    });
    if(quadEntities.length>MAX_QUADS) viewer.entities.remove(quadEntities.shift());
  }catch(_){}
}

// ═══════════════════════════════════════════════════════════════
//  rAF ANIMATION LOOP
// ═══════════════════════════════════════════════════════════════
function rafLoop(ts){
  if(!isPlaying) return;
  if(lastRafTs===null) lastRafTs=ts;
  const wallDt=(ts-lastRafTs)/1000;
  lastRafTs=ts;
  secAccum+=wallDt*speedFactor;

  const startSec=fullCoords[animationIndex]?.seconds??0;
  const targetSec=startSec+secAccum;
  let newIdx=animationIndex;
  while(newIdx<fullCoords.length-1&&fullCoords[newIdx+1].seconds<=targetSec) newIdx++;

  if(newIdx!==animationIndex){
    secAccum-=(fullCoords[newIdx].seconds-startSec);
    updatePoint(newIdx);
    updateChartMarker();
    if(newIdx%5===0) maybeAddQuad(newIdx);
  }

  if(animationIndex>=fullCoords.length-1){
    isPlaying=false;
    document.getElementById('togglePlayBtn').textContent='▶';
    return;
  }
  rafId=requestAnimationFrame(rafLoop);
}

function startAnimation(){
  if(!fullCoords.length) return;
  isPlaying=true; lastRafTs=null; secAccum=0;
  rafId=requestAnimationFrame(rafLoop);
  document.getElementById('togglePlayBtn').textContent='⏸';
}
function pauseAnimation(){
  isPlaying=false; cancelAnimationFrame(rafId);
  document.getElementById('togglePlayBtn').textContent='▶';
}

// Scrub by N seconds
function scrub(seconds){
  if(!fullCoords.length) return;
  const cur=fullCoords[animationIndex].seconds;
  const target=cur+seconds;
  let ni=animationIndex;
  if(seconds>0){ while(ni<fullCoords.length-1&&fullCoords[ni].seconds<target) ni++; }
  else          { while(ni>0&&fullCoords[ni].seconds>target) ni--; }
  pauseAnimation();
  updatePoint(ni);
  updateChartMarker();
}

// ═══════════════════════════════════════════════════════════════
//  CHART
// ═══════════════════════════════════════════════════════════════
function buildChart(){
  const ctx=document.getElementById('mainChart').getContext('2d');
  const seconds=fullCoords.map(p=>p.seconds);
  const alts   =fullCoords.map(p=>p.alt);
  const speeds =fullCoords.map((p,i)=>{
    if(i===0) return 0;
    const prev=fullCoords[i-1],dt=p.seconds-prev.seconds;
    if(dt<=0) return 0;
    const dx=(p.lon-prev.lon)*111320*Math.cos(p.lat*Math.PI/180);
    const dy=(p.lat-prev.lat)*111320;
    return(Math.sqrt(dx*dx+dy*dy)/dt)*3.6;
  });
  if(mainChart) mainChart.destroy();
  mainChart=new Chart(ctx,{
    type:'line',
    data:{
      labels:seconds,
      datasets:[
        {label:'Höhe (m)',data:alts,borderColor:'#4fa3ff',borderWidth:1.5,
         backgroundColor:'rgba(79,163,255,0.1)',fill:true,yAxisID:'y1',pointRadius:0,tension:0.3},
        {label:'Speed (km/h)',data:speeds,borderColor:'#00e5a0',borderWidth:1.5,
         backgroundColor:'transparent',fill:false,yAxisID:'y2',pointRadius:0,tension:0.3}
      ]
    },
    options:{
      responsive:true,maintainAspectRatio:false,animation:false,
      plugins:{
        legend:{labels:{color:'#6a88aa',font:{family:'Rajdhani',size:11},boxWidth:12}},
        annotation:{
          annotations:{
            cursor:{type:'line',xMin:seconds[0],xMax:seconds[0],
              borderColor:'#ff4f6a',borderWidth:2,
              label:{display:true,content:()=>fmtTime(fullCoords[animationIndex]?.seconds??0),
                backgroundColor:'#ff4f6a',color:'#fff',
                font:{family:'JetBrains Mono',size:10},position:'start',padding:4}
            },
            cutStart:{type:'line',xMin:seconds[0],xMax:seconds[0],
              borderColor:'#4fa3ff',borderWidth:2,display:false,
              label:{display:true,content:'Start',backgroundColor:'#4fa3ff',color:'#fff'}},
            cutEnd:{type:'line',xMin:seconds.at(-1),xMax:seconds.at(-1),
              borderColor:'#00e5a0',borderWidth:2,display:false,
              label:{display:true,content:'Ende',backgroundColor:'#00e5a0',color:'#fff'}}
          }
        }
      },
      onClick:(ev)=>{
        const pts=mainChart.getElementsAtEventForMode(ev,'nearest',{intersect:false},false);
        if(pts.length){pauseAnimation();updatePoint(pts[0].index);updateChartMarker();}
      },
      scales:{
        x:{type:'linear',
          ticks:{color:'#6a88aa',font:{family:'JetBrains Mono',size:9},callback:v=>fmtTime(v),maxTicksLimit:8},
          grid:{color:'rgba(255,255,255,0.04)'}},
        y1:{type:'linear',position:'left',
          title:{display:true,text:'Höhe (m)',color:'#4fa3ff',font:{size:10}},
          ticks:{color:'#4fa3ff',font:{size:9}},grid:{color:'rgba(255,255,255,0.04)'}},
        y2:{type:'linear',position:'right',
          title:{display:true,text:'km/h',color:'#00e5a0',font:{size:10}},
          ticks:{color:'#00e5a0',font:{size:9}},grid:{drawOnChartArea:false}}
      }
    }
  });
}

function updateChartMarker(){
  if(!mainChart||!fullCoords.length) return;
  const s=fullCoords[animationIndex]?.seconds??0;
  const a=mainChart.options.plugins.annotation.annotations.cursor;
  a.xMin=a.xMax=s; mainChart.update('none');
}

// Touch drag on chart for cut markers
let draggingCut=null;
document.getElementById('mainChart').addEventListener('touchstart',e=>{
  if(!cutModeActive||!mainChart) return;
  const x=e.touches[0].clientX-mainChart.canvas.getBoundingClientRect().left;
  const ann=mainChart.options.plugins.annotation.annotations;
  const sp=mainChart.scales.x.getPixelForValue(ann.cutStart.xMin);
  const ep=mainChart.scales.x.getPixelForValue(ann.cutEnd.xMin);
  draggingCut=Math.abs(x-sp)<24?'start':Math.abs(x-ep)<24?'end':null;
},{passive:true});
document.addEventListener('touchmove',e=>{
  if(!draggingCut||!mainChart) return;
  const x=e.touches[0].clientX-mainChart.canvas.getBoundingClientRect().left;
  const t=mainChart.scales.x.getValueForPixel(x);
  const key=draggingCut==='start'?'cutStart':'cutEnd';
  mainChart.options.plugins.annotation.annotations[key].xMin=t;
  mainChart.options.plugins.annotation.annotations[key].xMax=t;
  mainChart.update('none');
},{passive:true});
document.addEventListener('touchend',()=>{draggingCut=null;});

// ═══════════════════════════════════════════════════════════════
//  CUT MODE
// ═══════════════════════════════════════════════════════════════
function activateCutMode(){
  if(!mainChart||!fullCoords.length) return;
  cutModeActive=true;
  document.getElementById('cutModeBtn').classList.add('active');
  const ann=mainChart.options.plugins.annotation.annotations;
  const s=fullCoords.map(p=>p.seconds);
  ann.cutStart.display=ann.cutEnd.display=true;
  ann.cutStart.xMin=ann.cutStart.xMax=s[Math.floor(s.length*.1)];
  ann.cutEnd.xMin  =ann.cutEnd.xMax  =s[Math.floor(s.length*.9)];
  mainChart.update('none');
}
function applyCut(){
  if(!cutModeActive||!mainChart) return;
  const ann=mainChart.options.plugins.annotation.annotations;
  const t0=ann.cutStart.xMin,t1=ann.cutEnd.xMin;
  fullCoords=fullCoords.filter(p=>p.seconds>=t0&&p.seconds<=t1);
  if(!fullCoords.length){alert('Kein Bereich übrig.');return;}
  startAltitude=null; animationIndex=0;
  cutModeActive=false;
  document.getElementById('cutModeBtn').classList.remove('active');
  buildChart(); updatePoint(0);
  document.getElementById('cutUploadOverlay').classList.add('open');
}

// ═══════════════════════════════════════════════════════════════
//  PROGRESS BAR CLICK
// ═══════════════════════════════════════════════════════════════
document.getElementById('progressBar').addEventListener('click',e=>{
  if(!fullCoords.length) return;
  const pct=e.offsetX/e.currentTarget.offsetWidth;
  const ni=Math.round(pct*(fullCoords.length-1));
  pauseAnimation(); updatePoint(ni); updateChartMarker();
});

// ═══════════════════════════════════════════════════════════════
//  SUPABASE
// ═══════════════════════════════════════════════════════════════
async function listSupabaseFiles(){
  const list=document.getElementById('serverFileList');
  list.innerHTML='<p style="color:var(--text-dim);font-size:.85rem;padding:8px">Lade…</p>';
  const{data,error}=await supabase.storage.from('flugspuren').list();
  if(error){list.innerHTML='<p style="color:var(--danger)">Fehler: '+error.message+'</p>';return;}
  list.innerHTML='';
  (data||[]).forEach(file=>{
    const row=document.createElement('div'); row.className='server-file-row';
    const name=document.createElement('span'); name.className='server-file-name'; name.textContent=file.name;
    name.onclick=async()=>{
      document.getElementById('serverFileOverlay').classList.remove('open');
      const{data:u}=await supabase.storage.from('flugspuren').createSignedUrl(file.name,3600);
      if(u?.signedUrl) loadFromServer(u.signedUrl);
    };
    const del=document.createElement('button'); del.className='server-file-action'; del.textContent='🗑';
    del.onclick=async()=>{
      if(!confirm('Löschen: "'+file.name+'"?')) return;
      const{error}=await supabase.storage.from('flugspuren').remove([file.name]);
      if(error) alert('Fehler: '+error.message); else listSupabaseFiles();
    };
    row.appendChild(name); row.appendChild(del); list.appendChild(row);
  });
  if(!data?.length) list.innerHTML='<p style="color:var(--text-dim);font-size:.85rem;padding:8px">Keine Dateien.</p>';
}

async function uploadCurrent(filename){
  const blob=new Blob([buildKml()],{type:'application/vnd.google-earth.kml+xml'});
  const{error}=await supabase.storage.from('flugspuren').upload(filename,new File([blob],filename),{upsert:true});
  if(error) alert('Upload fehlgeschlagen: '+error.message); else alert('Gespeichert: '+filename);
}

// ═══════════════════════════════════════════════════════════════
//  KML EXPORT
// ═══════════════════════════════════════════════════════════════
function buildKml(){
  let kml=`<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2">\n  <Document>\n`;
  for(const p of fullCoords){
    if(!Number.isInteger(p.seconds)) continue;
    kml+=`    <Placemark>\n      <name>${fmtTime(p.seconds)}</name>\n      <Point>\n        <coordinates>${p.lon},${p.lat},${p.alt}</coordinates>\n      </Point>\n    </Placemark>\n`;
  }
  return kml+`  </Document>\n</kml>`;
}
function saveLocal(){
  if(!fullCoords.length){alert('Keine Daten.');return;}
  const a=Object.assign(document.createElement('a'),{
    href:URL.createObjectURL(new Blob([buildKml()],{type:'application/vnd.google-earth.kml+xml'})),
    download:(originalFileName||'flugroute').replace('.kml','_export.kml')
  });
  document.body.appendChild(a);a.click();document.body.removeChild(a);
}

// ═══════════════════════════════════════════════════════════════
//  CHART PANEL RESIZE
// ═══════════════════════════════════════════════════════════════
const chartPanel=document.getElementById('chartPanel');
const handle    =document.getElementById('chartHandle');
let resizing=false,rsY=0,rsH=0;
handle.addEventListener('pointerdown',e=>{resizing=true;rsY=e.clientY;rsH=chartPanel.offsetHeight;handle.setPointerCapture(e.pointerId);});
handle.addEventListener('pointermove',e=>{if(!resizing)return;const h=Math.max(80,Math.min(window.innerHeight*.7,rsH+(rsY-e.clientY)));chartPanel.style.height=h+'px';});
handle.addEventListener('pointerup',()=>{resizing=false;});

// ═══════════════════════════════════════════════════════════════
//  KEYBOARD SHORTCUTS
// ═══════════════════════════════════════════════════════════════
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT') return;
  switch(e.code){
    case 'Space': e.preventDefault(); if(isPlaying) pauseAnimation(); else startAnimation(); break;
    case 'ArrowRight': scrub(10); break;
    case 'ArrowLeft':  scrub(-10); break;
    case 'ArrowUp':    scrub(60); break;
    case 'ArrowDown':  scrub(-60); break;
    case 'KeyC': cycleCamMode(); break;
    case 'KeyF':
      followEnabled=!followEnabled;
      document.getElementById('toggleFollow').classList.toggle('active',followEnabled);
      document.getElementById('followIndicator').classList.toggle('show',followEnabled);
      if(!followEnabled) stopFollow();
      else if(fullCoords.length){ userManuallyMoved=false; updatePoint(animationIndex); }
      break;
  }
});

document.getElementById('toggleFollow').onclick=()=>{
  followEnabled=!followEnabled;
  document.getElementById('toggleFollow').classList.toggle('active',followEnabled);
  document.getElementById('followIndicator').classList.toggle('show',followEnabled);
  if(!followEnabled) stopFollow();
  else if(fullCoords.length){ userManuallyMoved=false; updatePoint(animationIndex); }
};
const speedVals=[1,2,4,8,16]; let speedIdx=0;
document.getElementById('speedBtn').onclick=()=>{
  speedIdx=(speedIdx+1)%speedVals.length;
  speedFactor=speedVals[speedIdx];
  document.getElementById('speedBtn').textContent=speedFactor+'×';
};
document.getElementById('fullscreenBtn').onclick=()=>{
  if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
  else document.exitFullscreen();
};
document.getElementById('cutModeBtn').onclick=()=>{ if(!cutModeActive) activateCutMode(); else applyCut(); };

// ═══════════════════════════════════════════════════════════════
//  UTILS
// ═══════════════════════════════════════════════════════════════
function fmtTime(sec){
  const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=Math.floor(sec%60);
  return h>0?`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${m}:${String(s).padStart(2,'0')}`;
}
function showLoading(on){
  const b=document.getElementById('loadingBar');
  b.style.display=on?'block':'none'; b.style.width=on?'70%':'100%';
  if(!on) setTimeout(()=>b.style.display='none',350);
}
function showKeyHint(){
  const h=document.getElementById('keyHint');
  h.classList.add('show');
  setTimeout(()=>h.classList.remove('show'),4000);
}

// Init follow indicator
document.getElementById('followIndicator').classList.toggle('show',followEnabled);
