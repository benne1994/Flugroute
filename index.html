<style>
:root {
  --c0:#060a10; --c1:#0b1220; --c2:#111c30;
  --accent:#00d4ff; --accent2:#7b2fff; --green:#00ff9d; --red:#ff3864; --orange:#ff9500;
  --text:#e8f4ff; --dim:#4a6080; --dimmer:#2a3a50;
  --glow: 0 0 20px rgba(0,212,255,.4);
  --glow2: 0 0 20px rgba(123,47,255,.4);
  --font:'Orbitron',monospace; --body:'Inter',sans-serif;
  --r:14px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:var(--c0);font-family:var(--body);color:var(--text);overflow:hidden}
#cesiumContainer{position:absolute;inset:0}

/* ── SCANLINE OVERLAY ── */
#overlay{position:absolute;inset:0;pointer-events:none;z-index:1;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.03) 2px,rgba(0,0,0,.03) 4px);
}

/* ── VIGNETTE ── */
#vignette{position:absolute;inset:0;pointer-events:none;z-index:2;
  background:radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,.55) 100%);
}

/* ── TOP BAR ── */
#topBar{
  position:absolute;top:0;left:0;right:0;height:52px;z-index:100;
  background:linear-gradient(180deg, rgba(6,10,16,.95) 0%, transparent 100%);
  display:flex;align-items:center;padding:0 16px;gap:12px;
  border-bottom:1px solid rgba(0,212,255,.08);
}
#appTitle{
  font-family:var(--font);font-size:13px;font-weight:900;letter-spacing:.2em;
  color:var(--accent);text-transform:uppercase;
  text-shadow:0 0 20px rgba(0,212,255,.8);
  white-space:nowrap;
}
#appTitle span{color:var(--accent2);text-shadow:0 0 20px rgba(123,47,255,.8)}
#topSep{flex:1}
#statusDot{width:7px;height:7px;border-radius:50%;background:var(--dim);flex-shrink:0;transition:background .3s,box-shadow .3s}
#statusDot.live{background:var(--green);box-shadow:0 0 8px var(--green)}
#statusLabel{font-family:var(--font);font-size:9px;letter-spacing:.15em;color:var(--dim);text-transform:uppercase}
#timeDisplay{font-family:var(--font);font-size:11px;letter-spacing:.1em;color:var(--accent);min-width:80px;text-align:right}

/* ── HUD PANELS ── */
.hud-panel{
  position:absolute;z-index:100;
  background:rgba(6,10,16,.82);
  border:1px solid rgba(0,212,255,.12);
  backdrop-filter:blur(20px) saturate(160%);
  -webkit-backdrop-filter:blur(20px) saturate(160%);
  border-radius:var(--r);
  overflow:hidden;
}
.hud-panel::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg, rgba(0,212,255,.04) 0%, transparent 60%);
  pointer-events:none;
}

/* LEFT HUD */
#hudLeft{top:62px;left:14px;width:172px}
.hud-header{
  padding:8px 12px 6px;
  border-bottom:1px solid rgba(0,212,255,.08);
  font-family:var(--font);font-size:8px;letter-spacing:.18em;
  color:var(--accent);text-transform:uppercase;opacity:.7;
}
.metric{padding:5px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid rgba(255,255,255,.03)}
.metric:last-child{border-bottom:none;padding-bottom:8px}
.metric-label{font-size:9px;font-weight:500;letter-spacing:.08em;color:var(--dim);text-transform:uppercase}
.metric-val{font-family:var(--font);font-size:12px;font-weight:700;color:var(--accent);text-align:right;min-width:70px}
.metric-val.up{color:var(--green);text-shadow:0 0 8px rgba(0,255,157,.5)}
.metric-val.dn{color:var(--red);text-shadow:0 0 8px rgba(255,56,100,.5)}
.metric-val.warn{color:var(--orange)}

/* SPEED GAUGE – right side */
#hudRight{top:62px;right:70px;width:160px}
.gauge-wrap{padding:10px 12px 12px;display:flex;flex-direction:column;align-items:center;gap:6px}
.gauge-label{font-family:var(--font);font-size:8px;letter-spacing:.15em;color:var(--dim);text-transform:uppercase}
#speedArc{display:block}
.gauge-val{font-family:var(--font);font-size:22px;font-weight:900;color:var(--accent);line-height:1;text-shadow:var(--glow)}
.gauge-unit{font-family:var(--font);font-size:9px;letter-spacing:.1em;color:var(--dim)}

/* ── CONTROLS ── */
#controls{
  position:absolute;right:14px;top:62px;z-index:200;
  display:flex;flex-direction:column;gap:8px;align-items:center;
}
.btn{
  width:44px;height:44px;border-radius:50%;
  border:1px solid var(--dimmer);background:rgba(6,10,16,.85);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  color:var(--dim);font-size:17px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;-webkit-tap-highlight-color:transparent;user-select:none;
  position:relative;overflow:hidden;
}
.btn::after{content:'';position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at center,rgba(0,212,255,.15) 0%,transparent 70%);opacity:0;transition:opacity .2s}
.btn:active::after{opacity:1}
.btn:active{transform:scale(.9)}
.btn:hover{border-color:var(--accent);color:var(--accent);box-shadow:var(--glow)}
.btn.on{border-color:var(--green);color:var(--green);box-shadow:0 0 12px rgba(0,255,157,.3)}
.btn.warn{border-color:var(--orange);color:var(--orange)}
.btn.big{width:52px;height:52px;font-size:20px;border-color:rgba(0,212,255,.3);color:var(--accent);box-shadow:var(--glow)}
.btn.big:hover{background:rgba(0,212,255,.1)}
#trailSlider{
  -webkit-appearance:slider-vertical;appearance:slider-vertical;
  width:44px;height:80px;cursor:pointer;accent-color:var(--accent);
  opacity:.6;transition:opacity .2s;
}
#trailSlider:hover{opacity:1}

/* ── CAM BADGE ── */
#camBadge{
  position:absolute;top:62px;left:50%;transform:translateX(-50%);z-index:200;
  background:rgba(6,10,16,.9);border:1px solid var(--accent);border-radius:20px;
  padding:5px 18px;font-family:var(--font);font-size:10px;letter-spacing:.15em;
  color:var(--accent);text-transform:uppercase;pointer-events:none;
  opacity:0;transition:opacity .4s;white-space:nowrap;
  box-shadow:var(--glow);
}
#camBadge.show{opacity:1}

/* ── PROGRESS ── */
#progressWrap{
  position:absolute;bottom:0;left:0;right:0;z-index:101;
  padding:0 0 3px;
}
#progressTrack{
  height:3px;background:rgba(255,255,255,.06);cursor:pointer;position:relative;
}
#progressFill{height:100%;width:0%;background:linear-gradient(90deg,var(--accent2),var(--accent));pointer-events:none;transition:none}
#progressHandle{
  position:absolute;top:50%;width:10px;height:10px;border-radius:50%;
  background:var(--accent);transform:translate(-50%,-50%);pointer-events:none;
  box-shadow:var(--glow);opacity:0;transition:opacity .2s;
}
#progressTrack:hover #progressHandle{opacity:1}

/* ── TIMELINE / CHART ── */
#chartWrap{
  position:absolute;bottom:3px;left:0;right:0;
  height:28%;min-height:90px;max-height:55vh;
  background:rgba(6,10,16,.88);
  border-top:1px solid rgba(0,212,255,.1);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  z-index:100;display:flex;flex-direction:column;
}
#chartDragHandle{
  height:20px;cursor:ns-resize;touch-action:none;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:rgba(0,212,255,.03);border-bottom:1px solid rgba(0,212,255,.06);
}
#chartDragHandle::before{content:'';width:32px;height:3px;border-radius:2px;background:var(--dimmer)}
#mainChart{flex:1;width:100%!important;min-height:0}

/* ── DIALOGS ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:3000;display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.overlay.open{display:flex}
.modal{
  background:linear-gradient(145deg, #0b1220, #060a10);
  border:1px solid rgba(0,212,255,.2);border-radius:20px;
  padding:24px;width:min(92vw,380px);
  display:flex;flex-direction:column;gap:10px;
  box-shadow:0 32px 80px rgba(0,0,0,.8), inset 0 1px 0 rgba(0,212,255,.1);
}
.modal h3{
  font-family:var(--font);font-size:.95rem;font-weight:700;
  color:var(--accent);letter-spacing:.1em;text-transform:uppercase;
  margin-bottom:4px;text-shadow:var(--glow);
}
.mBtn{
  width:100%;padding:13px 16px;border-radius:10px;
  border:1px solid var(--dimmer);background:rgba(255,255,255,.03);
  color:var(--text);font-family:var(--body);font-size:.9rem;font-weight:500;
  cursor:pointer;text-align:left;transition:all .15s;
  display:flex;align-items:center;gap:10px;
}
.mBtn:hover{background:rgba(0,212,255,.08);border-color:var(--accent);color:var(--accent)}
.mBtn.cancel{color:var(--dim);font-size:.82rem;justify-content:center;border-color:transparent}
.mBtn.cancel:hover{background:rgba(255,255,255,.04);border-color:var(--dimmer);color:var(--text)}
#serverFileList{max-height:40vh;overflow-y:auto;display:flex;flex-direction:column;gap:6px;scrollbar-width:thin;scrollbar-color:var(--accent) transparent}
.sfr{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:10px;border:1px solid var(--dimmer);background:rgba(255,255,255,.02);transition:background .15s}
.sfr:hover{background:rgba(0,212,255,.05)}
.sfn{flex:1;font-size:.88rem;cursor:pointer;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sfn:hover{color:var(--accent)}
.sfa{border:none;background:rgba(255,56,100,.1);color:var(--dim);border-radius:6px;padding:5px 9px;cursor:pointer;font-size:.75rem;transition:all .15s}
.sfa:hover{background:rgba(255,56,100,.25);color:var(--red)}

/* ── SPLASH / LOADING ── */
#splash{
  position:absolute;inset:0;z-index:5000;background:var(--c0);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
  transition:opacity .6s;
}
#splash.hide{opacity:0;pointer-events:none}
.splash-title{font-family:var(--font);font-size:clamp(18px,5vw,32px);font-weight:900;letter-spacing:.25em;text-transform:uppercase;color:var(--accent);text-shadow:var(--glow)}
.splash-title span{color:var(--accent2);text-shadow:var(--glow2)}
.splash-sub{font-size:.8rem;letter-spacing:.12em;color:var(--dim);text-transform:uppercase}
.spinner{width:40px;height:40px;border:2px solid var(--dimmer);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

#loadBar{position:absolute;top:0;left:0;height:2px;width:0;background:linear-gradient(90deg,var(--accent2),var(--accent));z-index:9999;transition:width .3s;pointer-events:none}

.cesium-viewer-toolbar,.cesium-widget-credits{display:none!important}
#fileInput{display:none}

/* ── KEYBOARD HINT ── */
#keyHint{
  position:absolute;bottom:calc(28% + 10px);left:50%;transform:translateX(-50%);
  background:rgba(6,10,16,.9);border:1px solid var(--dimmer);border-radius:8px;
  padding:4px 14px;font-size:9px;letter-spacing:.07em;color:var(--dim);
  pointer-events:none;opacity:0;transition:opacity .5s;z-index:101;white-space:nowrap;
}
#keyHint.show{opacity:1}

/* ── FOLLOW TAG ── */
#followTag{
  position:absolute;top:62px;left:50%;transform:translateX(-50%);z-index:200;
  background:rgba(0,255,157,.1);border:1px solid rgba(0,255,157,.3);border-radius:20px;
  padding:4px 14px;font-family:var(--font);font-size:9px;letter-spacing:.15em;
  color:var(--green);text-transform:uppercase;pointer-events:none;
  display:none;white-space:nowrap;
}
#followTag.show{display:block}
</style>

<script>
'use strict';

// ═══════════════════════════════════════════════════════════
// CESIUM SETUP
// ═══════════════════════════════════════════════════════════
Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiI5ZTI3MDRmMy1mYjg5LTRjNmYtYjBmZC1kZDQxN2NlNzVkZDEiLCJpZCI6Mjk3NzA1LCJpYXQiOjE3NDU5MzE5MTh9.svRycz7t606srY9WbWiWUaLB2hJpycWmo835Dy-VWtw';

const viewer = new Cesium.Viewer('cesiumContainer', {
  sceneMode: Cesium.SceneMode.SCENE3D,
  animation:false, timeline:false, baseLayerPicker:true,
  fullscreenButton:false, homeButton:false, sceneModePicker:false,
  geocoder:false, navigationHelpButton:false,
  infoBox:false, selectionIndicator:false,
  terrain: Cesium.Terrain.fromWorldTerrain(),
  msaaSamples:1,
  useBrowserRecommendedResolution:false,
});
const scene = viewer.scene, camera = viewer.camera, ctrl = scene.screenSpaceCameraController;

// Performance
ctrl.rotateRate=.22; ctrl.zoomRate=.3; ctrl.tiltRate=.12; ctrl.minimumZoomDistance=20;
scene.fog.enabled=false;
scene.globe.showGroundAtmosphere=false;
scene.highDynamicRange=false;
scene.globe.enableLighting=false;
scene.globe.maximumScreenSpaceError=3;

// ── FOCUSED TILE LOADING ──
// Strategie: maximumScreenSpaceError (SSE) dynamisch basierend auf Kameraabstand
// zur aktuellen Falcon-Position anpassen.
// Nah = niedriger SSE (feine Tiles), weit weg = hoher SSE (kaum Tiles geladen).
// Kein cartographicLimitRectangle – das blockiert das Rendering komplett.

let focusLon = 0, focusLat = 0, focusActive = false;
const SSE_NEAR = 2;   // hohe Detailtiefe direkt am Falcon
const SSE_FAR  = 48;  // minimale Tiles weit weg

scene.preUpdate.addEventListener(() => {
  if (!focusActive) return;
  const camCarto = camera.positionCartographic;
  if (!camCarto) return;
  const dLon = Cesium.Math.toDegrees(camCarto.longitude) - focusLon;
  const dLat = Cesium.Math.toDegrees(camCarto.latitude)  - focusLat;
  const distKm = Math.sqrt(dLon*dLon + dLat*dLat) * 111.0;
  const focusKm = window._focusRadiusKm || 15;
  // Smooth ramp: within focusKm = near quality, beyond = far quality
  const t = Math.min(Math.max((distKm - 0.5) / Math.max(focusKm, 1), 0), 1);
  scene.globe.maximumScreenSpaceError = SSE_NEAR + t * (SSE_FAR - SSE_NEAR);
});

function setFocusPoint(lon, lat) {
  focusLon = lon; focusLat = lat; focusActive = true;
}
function clearFocusPoint() {
  focusActive = false;
  scene.globe.maximumScreenSpaceError = 4;
}

// ═══════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════
const ALT=50;
let coords=[], idx=0, trailLen=300;
let playing=false, speed=1, followOn=true, camMode=0, is3D=false;
let startAlt=null, origName=null, origKml=null, cutActive=false;
let userMoved=false, moveTimer=null;
let mainChart=null, rafId=null, lastTs=null, secAcc=0;
let maxSpeed=0;

// Cam offsets: behind / cockpit / overview / side
const CAM_OFF=[
  new Cesium.Cartesian3(0,-280,75),
  new Cesium.Cartesian3(0,5,1.5),
  new Cesium.Cartesian3(0,-800,400),
  new Cesium.Cartesian3(200,-150,80),
];
const CAM_NAMES=['Hinter-Ansicht','Cockpit','Übersicht','Seitenansicht'];

// ═══════════════════════════════════════════════════════════
// PRIMITIVES
// ═══════════════════════════════════════════════════════════
let ghostPrim=null, trailPrim=null;
let lastTStart=-1, lastTEnd=-1;
const REBUILD_STEP=4;

function buildGhost(positions){
  if(ghostPrim){scene.primitives.remove(ghostPrim);ghostPrim=null;}
  if(positions.length<2) return;
  ghostPrim=scene.primitives.add(new Cesium.Primitive({
    geometryInstances: new Cesium.GeometryInstance({
      geometry: new Cesium.PolylineGeometry({positions, width:1.2,
        vertexFormat:Cesium.PolylineColorAppearance.VERTEX_FORMAT}),
      attributes:{color:Cesium.ColorGeometryInstanceAttribute.fromColor(
        Cesium.Color.fromCssColorString('#7b2fff').withAlpha(0.22))}
    }),
    appearance:new Cesium.PolylineColorAppearance(),
    asynchronous:false
  }));
}

function buildTrail(start, end){
  if(start===lastTStart&&end===lastTEnd) return;
  lastTStart=start; lastTEnd=end;
  if(trailPrim){scene.primitives.remove(trailPrim);trailPrim=null;}
  if(end-start<2) return;
  // Color-coded by altitude: low=cyan, high=purple
  const slice=coords.slice(start,end+1);
  const minA=Math.min(...slice.map(c=>c.alt));
  const maxA=Math.max(...slice.map(c=>c.alt))+1;
  // Build per-segment colored geometry
  const instances=[];
  for(let i=1;i<slice.length;i++){
    const t=(slice[i].alt-minA)/(maxA-minA);
    const r=Math.round(0   + t*123);
    const g=Math.round(212 - t*130);
    const b=255;
    instances.push(new Cesium.GeometryInstance({
      geometry:new Cesium.PolylineGeometry({
        positions:[slice[i-1].pos3d,slice[i].pos3d],width:4,
        vertexFormat:Cesium.PolylineColorAppearance.VERTEX_FORMAT
      }),
      attributes:{color:Cesium.ColorGeometryInstanceAttribute.fromColor(
        new Cesium.Color(r/255,g/255,b/255,.95))}
    }));
  }
  if(!instances.length) return;
  trailPrim=scene.primitives.add(new Cesium.Primitive({
    geometryInstances:instances,
    appearance:new Cesium.PolylineColorAppearance(),
    asynchronous:false
  }));
}

// ═══════════════════════════════════════════════════════════
// FALCON
// ═══════════════════════════════════════════════════════════
let falconEnt=null;
const falcPos=new Cesium.Cartesian3();
const _d=new Cesium.Cartesian3(),_r=new Cesium.Cartesian3(),_u=new Cesium.Cartesian3();
const _m=new Cesium.Matrix3(),_qb=new Cesium.Quaternion(),_qo=new Cesium.Quaternion();
const _xR=Cesium.Quaternion.fromAxisAngle(Cesium.Cartesian3.UNIT_X,Cesium.Math.toRadians(-90));
const _tf=new Cesium.Matrix4();

function buildFalcon(){
  if(falconEnt){viewer.entities.remove(falconEnt);falconEnt=null;}
  Cesium.Cartesian3.clone(coords[0].pos3d,falcPos);
  falconEnt=viewer.entities.add({
    position:new Cesium.CallbackProperty(()=>falcPos,false),
    orientation:new Cesium.CallbackProperty(calcOri,false),
    model:{uri:'https://benne1994.github.io/Flugroute/falcon_flying.glb',
      scale:.9,minimumPixelSize:32,maximumScale:260}
  });
}
function calcOri(){
  if(idx<1) return Cesium.Quaternion.IDENTITY;
  Cesium.Cartesian3.subtract(coords[idx].pos3d,coords[idx-1].pos3d,_d);
  if(Cesium.Cartesian3.magnitudeSquared(_d)<1e-10) return Cesium.Quaternion.IDENTITY;
  Cesium.Cartesian3.normalize(_d,_d);
  Cesium.Cartesian3.cross(Cesium.Cartesian3.UNIT_Z,_d,_r);
  Cesium.Cartesian3.normalize(_r,_r);
  Cesium.Cartesian3.cross(_d,_r,_u);
  Cesium.Matrix3.setColumn(_m,0,_r,_m);
  Cesium.Matrix3.setColumn(_m,1,_u,_m);
  Cesium.Matrix3.setColumn(_m,2,_d,_m);
  Cesium.Quaternion.fromRotationMatrix(_m,_qb);
  return Cesium.Quaternion.multiply(_qb,_xR,_qo);
}

// ═══════════════════════════════════════════════════════════
// PARSER
// ═══════════════════════════════════════════════════════════
function parseKml(text){
  const raw=[]; let t=null;
  for(let line of text.split(/\r?\n/)){
    line=line.trim();
    if(line.startsWith('<name>')){
      const p=line.replace(/<\/?name>/g,'').trim().split(':').map(Number);
      if(p.length>=2) t=p[0]*3600+p[1]*60+(p[2]||0);
    }
    if(line.includes('<coordinates>')&&t!==null){
      const cs=line.substring(line.indexOf('>')+1,line.indexOf('</coordinates>')).trim();
      const [lon,lat,alt]=cs.split(',').map(Number);
      if(!isNaN(lon)&&!isNaN(lat)&&!isNaN(alt)) raw.push({seconds:t,lon,lat,alt});
    }
  }
  if(!raw.length) return[];
  const STEPS=6, out=[];
  for(let i=0;i<raw.length;i++){
    if(i===0){out.push({...raw[0],distCum:0,pos3d:Cesium.Cartesian3.fromDegrees(raw[0].lon,raw[0].lat,raw[0].alt+ALT)});continue;}
    const pv=raw[i-1],cr=raw[i];
    for(let s=1;s<=STEPS;s++){
      const f=s/STEPS;
      const lon=pv.lon+(cr.lon-pv.lon)*f, lat=pv.lat+(cr.lat-pv.lat)*f;
      const alt=pv.alt+(cr.alt-pv.alt)*f, seconds=pv.seconds+(cr.seconds-pv.seconds)*f;
      const last=out[out.length-1];
      const dx=(lon-last.lon)*111320*Math.cos(lat*Math.PI/180), dy=(lat-last.lat)*111320;
      out.push({seconds,lon,lat,alt,distCum:last.distCum+Math.sqrt(dx*dx+dy*dy),
        pos3d:Cesium.Cartesian3.fromDegrees(lon,lat,alt+ALT)});
    }
  }
  return out;
}

// ═══════════════════════════════════════════════════════════
// LOAD
// ═══════════════════════════════════════════════════════════
function loadKmlText(text,name){
  origKml=text; origName=name;
  document.getElementById('statusLabel').textContent='Lade…';
  document.getElementById('statusDot').className='';
  setTimeout(()=>{
    coords=parseKml(text);
    if(!coords.length){alert('Keine Koordinaten.');return;}
    maxSpeed=0;
    buildGhost(coords.map(c=>c.pos3d));
    lastTStart=-1; lastTEnd=-1;
    idx=0; startAlt=null; playing=false; lastTs=null; secAcc=0;
    cancelAnimationFrame(rafId);
    document.getElementById('btnPlay').textContent='▶';
    buildFalcon();
    buildChart();
    updateFrame(0,true);
    camera.flyTo({destination:Cesium.Cartesian3.fromDegrees(coords[0].lon,coords[0].lat,coords[0].alt+2800),duration:2.5});
    document.getElementById('statusLabel').textContent='Aktiv';
    document.getElementById('statusDot').className='live';
    showKeyHint();
    setTimeout(()=>document.getElementById('splash').classList.add('hide'),200);
  },20);
}
async function loadFromServer(url){
  showLoad(true);
  try{const r=await fetch(url);if(!r.ok)throw new Error('HTTP '+r.status);loadKmlText(await r.text(),url.split('/').pop());}
  catch(e){alert('Fehler: '+e.message);}
  showLoad(false);
}

// ═══════════════════════════════════════════════════════════
// UPDATE FRAME
// ═══════════════════════════════════════════════════════════
function updateFrame(newIdx,force){
  idx=newIdx;
  const p=coords[idx];
  Cesium.Cartesian3.clone(p.pos3d,falcPos);

  // Trail: only rebuild on step or force
  const ts=Math.max(0,idx-trailLen);
  if(force||Math.abs(idx-lastTEnd)>=REBUILD_STEP||ts!==lastTStart) buildTrail(ts,idx);

  // Focus tile loading around current position
  setFocusPoint(p.lon, p.lat);

  // Camera
  if(followOn&&!userMoved&&camMode!==4) applyFollow(p);

  // HUD
  if(startAlt===null) startAlt=p.alt;
  let spd=0,vario=0,glide=0;
  if(idx>0){
    const pv=coords[idx-1],dt=p.seconds-pv.seconds;
    if(dt>0){
      const dx=(p.lon-pv.lon)*111320*Math.cos(p.lat*Math.PI/180),dy=(p.lat-pv.lat)*111320;
      spd=(Math.sqrt(dx*dx+dy*dy)/dt)*3.6;
      vario=(p.alt-pv.alt)/dt;
      if(vario<-0.1) glide=spd/3.6/Math.abs(vario);
      if(spd>maxSpeed) maxSpeed=spd;
    }
  }

  // Speed gauge
  const arcLen=173, pct=Math.min(spd/Math.max(maxSpeed,80),1);
  document.getElementById('arcFill').style.strokeDashoffset=(arcLen*(1-pct)).toFixed(1);
  document.getElementById('mSpeed').textContent=Math.round(spd);

  document.getElementById('mAlt').textContent=p.alt.toFixed(1)+' m';
  document.getElementById('mRel').textContent=(p.alt-startAlt).toFixed(1)+' m';
  document.getElementById('mDist').textContent=((p.distCum||0)/1000).toFixed(2)+' km';
  document.getElementById('mGlide').textContent=glide>0?glide.toFixed(1)+'：1':'–';
  document.getElementById('timeDisplay').textContent=fmtT(p.seconds);
  const ve=document.getElementById('mVario');
  ve.textContent=(vario>=0?'+':'')+vario.toFixed(2)+' m/s';
  ve.className='metric-val'+(vario>0.3?' up':vario<-0.3?' dn':'');

  // Progress
  const pct2=coords.length>1?(idx/(coords.length-1))*100:0;
  document.getElementById('progressFill').style.width=pct2+'%';
  document.getElementById('progressHandle').style.left=pct2+'%';
}

// ═══════════════════════════════════════════════════════════
// CAMERA
// ═══════════════════════════════════════════════════════════
function applyFollow(p){
  if(scene.mode===Cesium.SceneMode.SCENE2D){
    camera.setView({destination:Cesium.Cartesian3.fromDegrees(p.lon,p.lat,camera.positionCartographic.height)});
    return;
  }
  Cesium.Transforms.eastNorthUpToFixedFrame(p.pos3d,undefined,_tf);
  camera.lookAtTransform(_tf,CAM_OFF[camMode]);
}
function stopFollow(){camera.lookAtTransform(Cesium.Matrix4.IDENTITY);}

scene.canvas.addEventListener('pointerdown',()=>{
  if(!followOn) return;
  userMoved=true;
  clearTimeout(moveTimer);
  moveTimer=setTimeout(()=>{
    userMoved=false;
    if(followOn&&coords.length&&camMode<4) applyFollow(coords[idx]);
  },3000);
},{passive:true});

// ═══════════════════════════════════════════════════════════
// RAF LOOP
// ═══════════════════════════════════════════════════════════
function rafLoop(ts){
  if(!playing) return;
  if(lastTs===null) lastTs=ts;
  secAcc+=Math.min((ts-lastTs)/1000,.1)*speed;
  lastTs=ts;
  const s0=coords[idx]?.seconds??0, tgt=s0+secAcc;
  let lo=idx,hi=coords.length-1,ni=idx;
  while(lo<=hi){const m=(lo+hi)>>1;if(coords[m].seconds<=tgt){ni=m;lo=m+1;}else hi=m-1;}
  if(ni!==idx){secAcc-=(coords[ni].seconds-s0);updateFrame(ni,false);updateChartMarker();}
  if(idx>=coords.length-1){playing=false;document.getElementById('btnPlay').textContent='▶';document.getElementById('statusDot').className='';return;}
  rafId=requestAnimationFrame(rafLoop);
}
function startPlay(){if(!coords.length)return;playing=true;lastTs=null;secAcc=0;rafId=requestAnimationFrame(rafLoop);document.getElementById('btnPlay').textContent='⏸';document.getElementById('statusDot').className='live';}
function pausePlay(){playing=false;cancelAnimationFrame(rafId);document.getElementById('btnPlay').textContent='▶';}
function scrub(s){
  if(!coords.length) return;
  const tgt=coords[idx].seconds+s;
  let ni=idx;
  if(s>0){while(ni<coords.length-1&&coords[ni].seconds<tgt)ni++;}
  else{while(ni>0&&coords[ni].seconds>tgt)ni--;}
  pausePlay();updateFrame(ni,true);updateChartMarker();
}

// ═══════════════════════════════════════════════════════════
// CHART
// ═══════════════════════════════════════════════════════════
function buildChart(){
  const ctx=document.getElementById('mainChart').getContext('2d');
  const secs=coords.map(c=>c.seconds);
  const alts=coords.map(c=>c.alt);
  const spds=coords.map((c,i)=>{
    if(!i) return 0;
    const pv=coords[i-1],dt=c.seconds-pv.seconds;
    if(dt<=0) return 0;
    const dx=(c.lon-pv.lon)*111320*Math.cos(c.lat*Math.PI/180),dy=(c.lat-pv.lat)*111320;
    return(Math.sqrt(dx*dx+dy*dy)/dt)*3.6;
  });
  if(mainChart) mainChart.destroy();
  mainChart=new Chart(ctx,{
    type:'line',
    data:{labels:secs,datasets:[
      {label:'Höhe (m)',data:alts,borderColor:'#00d4ff',borderWidth:1.5,
       backgroundColor:(ctx2)=>{const g=ctx2.chart.ctx.createLinearGradient(0,0,0,ctx2.chart.height);g.addColorStop(0,'rgba(0,212,255,.25)');g.addColorStop(1,'rgba(0,212,255,0)');return g;},
       fill:true,yAxisID:'y1',pointRadius:0,tension:.3},
      {label:'Speed (km/h)',data:spds,borderColor:'#00ff9d',borderWidth:1.5,
       fill:false,yAxisID:'y2',pointRadius:0,tension:.3}
    ]},
    options:{
      responsive:true,maintainAspectRatio:false,animation:false,
      plugins:{
        legend:{labels:{color:'#4a6080',font:{family:'Inter',size:11},boxWidth:12}},
        annotation:{annotations:{
          cursor:{type:'line',xMin:secs[0],xMax:secs[0],borderColor:'#ff3864',borderWidth:2,
            label:{display:true,content:()=>fmtT(coords[idx]?.seconds??0),
              backgroundColor:'#ff3864',color:'#fff',font:{family:'Orbitron',size:9},position:'start',padding:4}},
          cutStart:{type:'line',xMin:secs[0],xMax:secs[0],borderColor:'#00d4ff',borderWidth:2,display:false,
            label:{display:true,content:'▶ Start',backgroundColor:'#00d4ff',color:'#000'}},
          cutEnd:{type:'line',xMin:secs.at(-1),xMax:secs.at(-1),borderColor:'#7b2fff',borderWidth:2,display:false,
            label:{display:true,content:'End ◀',backgroundColor:'#7b2fff',color:'#fff'}}
        }}
      },
      onClick:(ev)=>{
        const pts=mainChart.getElementsAtEventForMode(ev,'nearest',{intersect:false},false);
        if(pts.length){pausePlay();updateFrame(pts[0].index,true);updateChartMarker();}
      },
      scales:{
        x:{type:'linear',ticks:{color:'#2a3a50',font:{family:'Orbitron',size:8},callback:v=>fmtT(v),maxTicksLimit:8},grid:{color:'rgba(255,255,255,.03)'},border:{color:'rgba(255,255,255,.05)'}},
        y1:{type:'linear',position:'left',title:{display:true,text:'m',color:'#00d4ff',font:{size:9}},ticks:{color:'#00d4ff',font:{size:8}},grid:{color:'rgba(0,212,255,.06)'},border:{color:'rgba(0,212,255,.1)'}},
        y2:{type:'linear',position:'right',title:{display:true,text:'km/h',color:'#00ff9d',font:{size:9}},ticks:{color:'#00ff9d',font:{size:8}},grid:{drawOnChartArea:false},border:{color:'rgba(0,255,157,.1)'}}
      }
    }
  });
}
function updateChartMarker(){
  if(!mainChart||!coords.length) return;
  const a=mainChart.options.plugins.annotation.annotations.cursor;
  a.xMin=a.xMax=coords[idx]?.seconds??0; mainChart.update('none');
}

// Touch drag on chart
let dragCut=null;
document.getElementById('mainChart').addEventListener('touchstart',e=>{
  if(!cutActive||!mainChart) return;
  const x=e.touches[0].clientX-mainChart.canvas.getBoundingClientRect().left;
  const a=mainChart.options.plugins.annotation.annotations;
  const sp=mainChart.scales.x.getPixelForValue(a.cutStart.xMin);
  const ep=mainChart.scales.x.getPixelForValue(a.cutEnd.xMin);
  dragCut=Math.abs(x-sp)<30?'start':Math.abs(x-ep)<30?'end':null;
},{passive:true});
document.addEventListener('touchmove',e=>{
  if(!dragCut||!mainChart) return;
  const x=e.touches[0].clientX-mainChart.canvas.getBoundingClientRect().left;
  const t=mainChart.scales.x.getValueForPixel(x);
  const k=dragCut==='start'?'cutStart':'cutEnd';
  mainChart.options.plugins.annotation.annotations[k].xMin=t;
  mainChart.options.plugins.annotation.annotations[k].xMax=t;
  mainChart.update('none');
},{passive:true});
document.addEventListener('touchend',()=>dragCut=null);

// ═══════════════════════════════════════════════════════════
// CUT
// ═══════════════════════════════════════════════════════════
function activateCut(){
  if(!mainChart||!coords.length) return;
  cutActive=true; document.getElementById('btnCut').classList.add('warn');
  const a=mainChart.options.plugins.annotation.annotations;
  const s=coords.map(c=>c.seconds);
  a.cutStart.display=a.cutEnd.display=true;
  a.cutStart.xMin=a.cutStart.xMax=s[Math.floor(s.length*.1)];
  a.cutEnd.xMin=a.cutEnd.xMax=s[Math.floor(s.length*.9)];
  mainChart.update('none');
}
function applyCut(){
  if(!cutActive||!mainChart) return;
  const a=mainChart.options.plugins.annotation.annotations;
  coords=coords.filter(c=>c.seconds>=a.cutStart.xMin&&c.seconds<=a.cutEnd.xMin);
  if(!coords.length){alert('Kein Bereich.');return;}
  buildGhost(coords.map(c=>c.pos3d));
  lastTStart=-1; lastTEnd=-1; startAlt=null; idx=0;
  cutActive=false; document.getElementById('btnCut').classList.remove('warn');
  buildChart(); updateFrame(0,true);
  document.getElementById('mCutSave').classList.add('open');
}

async function listFiles(){
  const L=document.getElementById('serverFileList');
  L.innerHTML='<p style="color:var(--dim);font-size:.85rem;padding:8px">Lade…</p>';
  const{data,error}=await supabase.storage.from('flugspuren').list();
  if(error){L.innerHTML='<p style="color:var(--red)">'+error.message+'</p>';return;}
  L.innerHTML='';
  (data||[]).forEach(f=>{
    const row=document.createElement('div'); row.className='sfr';
    const nm=document.createElement('span'); nm.className='sfn'; nm.textContent=f.name;
    nm.onclick=async()=>{
      document.getElementById('mServer').classList.remove('open');
      const{data:u}=await supabase.storage.from('flugspuren').createSignedUrl(f.name,3600);
      if(u?.signedUrl) loadFromServer(u.signedUrl);
    };
    const dl=document.createElement('button'); dl.className='sfa'; dl.textContent='🗑';
    dl.onclick=async()=>{
      if(!confirm('Löschen: "'+f.name+'"?')) return;
      const{error:e}=await supabase.storage.from('flugspuren').remove([f.name]);
      if(e) alert(e.message); else listFiles();
    };
    row.appendChild(nm); row.appendChild(dl); L.appendChild(row);
  });
  if(!data?.length) L.innerHTML='<p style="color:var(--dim);font-size:.85rem;padding:8px">Keine Dateien vorhanden.</p>';
}
async function uploadCurrent(name){
  const blob=new Blob([buildKml()],{type:'application/vnd.google-earth.kml+xml'});
  const{error}=await supabase.storage.from('flugspuren').upload(name,new File([blob],name),{upsert:true});
  if(error) alert('Fehler: '+error.message); else alert('✔ Gespeichert: '+name);
}

function buildKml(){
  let k=`<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2">\n  <Document>\n`;
  for(const c of coords){if(!Number.isInteger(c.seconds)) continue;k+=`    <Placemark>\n      <name>${fmtT(c.seconds)}</name>\n      <Point>\n        <coordinates>${c.lon},${c.lat},${c.alt}</coordinates>\n      </Point>\n    </Placemark>\n`;}
  return k+`  </Document>\n</kml>`;
}

// ═══════════════════════════════════════════════════════════
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT') return;
  switch(e.code){
    case'Space': e.preventDefault(); playing?pausePlay():startPlay(); break;
    case'ArrowRight': scrub(10); break;
    case'ArrowLeft':  scrub(-10); break;
    case'ArrowUp':    scrub(60); break;
    case'ArrowDown':  scrub(-60); break;
    case'KeyC': cycleCam(); break;
    case'KeyF': toggleFollow(); break;
  }
});

function cycleCam(){
  camMode=(camMode+1)%CAM_NAMES.length;
  if(camMode<4&&coords.length){userMoved=false;applyFollow(coords[idx]);}

  setTimeout(()=>b.classList.remove('show'),2000);
}
function toggleFollow(){
  followOn=!followOn;
  document.getElementById('btnFollow').classList.toggle('on',followOn);
  document.getElementById('followTag').classList.toggle('show',followOn);

document.getElementById('btnCam').onclick=cycleCam;
document.getElementById('btnFollow').onclick=toggleFollow;
document.getElementById('btnFS').onclick=()=>{if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{}); else document.exitFullscreen();};
document.getElementById('btn3d').onclick=()=>{
  is3D=!is3D;
  scene.mode=is3D?Cesium.SceneMode.SCENE2D:Cesium.SceneMode.SCENE3D;
  document.getElementById('btn3d').textContent=is3D?'3D':'2D';
  if(!is3D) Cesium.createWorldTerrainAsync().then(t=>viewer.terrainProvider=t);
};
const spVals=[1,2,4,8,16,32];let spIdx=0;
document.getElementById('btnSpeed').onclick=()=>{
  spIdx=(spIdx+1)%spVals.length; speed=spVals[spIdx];
  document.getElementById('btnSpeed').textContent=speed+'×';
};
document.getElementById('btnCut').onclick=()=>cutActive?applyCut():activateCut();
document.getElementById('btnFile').onclick=()=>document.getElementById('mFile').classList.add('open');
document.getElementById('mFileClose').onclick=()=>document.getElementById('mFile').classList.remove('open');
document.getElementById('mLoadLocal').onclick=()=>{document.getElementById('mFile').classList.remove('open');setTimeout(()=>{const f=document.getElementById('fileInput');f.value='';f.click();},80);};
document.getElementById('mLoadServer').onclick=()=>{document.getElementById('mFile').classList.remove('open');document.getElementById('mServer').classList.add('open');listFiles();};
document.getElementById('mServerClose').onclick=()=>document.getElementById('mServer').classList.remove('open');
document.getElementById('mUpload').onclick=()=>{
  document.getElementById('mFile').classList.remove('open');
  const inp=document.createElement('input');inp.type='file';inp.accept='.kml';
  inp.onchange=async e=>{const f=e.target.files[0];if(!f)return;const n=prompt('Dateiname:',f.name)||f.name;showLoad(true);const{error}=await supabase.storage.from('flugspuren').upload(n,new File([f],n,{type:f.type}),{upsert:true});showLoad(false);if(error)alert(error.message);else alert('✔ Hochgeladen: '+n);};
  inp.click();
};
document.getElementById('mSaveLocal').onclick=()=>{document.getElementById('mFile').classList.remove('open');saveLocal();};
document.getElementById('fileInput').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;(function(fr){fr.onload=ev=>loadKmlText(ev.target.result,f.name);fr.readAsText(f);}(new FileReader()));});
document.getElementById('mCutYes').onclick=async()=>{document.getElementById('mCutSave').classList.remove('open');const n=prompt('Dateiname:',(origName||'cut').replace('.kml','_schnitt.kml'));if(n)await uploadCurrent(n);};
document.getElementById('mCutNo').onclick=()=>{document.getElementById('mCutSave').classList.remove('open');saveLocal();};

// ═══════════════════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════════════════
function fmtT(s){const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),ss=Math.floor(s%60);return h?`${h}:${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`:`${m}:${String(ss).padStart(2,'0')}`;}
function showLoad(on){const b=document.getElementById('loadBar');b.style.display=on?'block':'none';b.style.width=on?'70%':'100%';if(!on)setTimeout(()=>b.style.display='none',350);}
function showKeyHint(){const h=document.getElementById('keyHint');h.classList.add('show');setTimeout(()=>h.classList.remove('show'),4500);}

// Focus radius: slider value = km
function updateFocusRadius(km){
  window._focusRadiusKm = parseFloat(km);
}
window._focusRadiusKm = 2; // default 2 km

// ── INIT ──
navigator.geolocation.getCurrentPosition(p=>{
  camera.flyTo({destination:Cesium.Cartesian3.fromDegrees(p.coords.longitude,p.coords.latitude,1500),duration:4});
},()=>{});
document.getElementById('followTag').classList.toggle('show',followOn);

// Dismiss splash after cesium loads
viewer.scene.globe.tileLoadProgressEvent.addEventListener(n=>{
  if(n===0) setTimeout(()=>document.getElementById('splash').classList.add('hide'),600);
});
</script>
</body>
