  <style>

<script>
'use strict';

// ═══════════════════════════════════════════════════════════
// CESIUM – Performance flags first
// ═══════════════════════════════════════════════════════════
Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiI5ZTI3MDRmMy1mYjg5LTRjNmYtYjBmZC1kZDQxN2NlNzVkZDEiLCJpZCI6Mjk3NzA1LCJpYXQiOjE3NDU5MzE5MTh9.svRycz7t606srY9WbWiWUaLB2hJpycWmo835Dy-VWtw';

const viewer = new Cesium.Viewer('cesiumContainer', {
  sceneMode: Cesium.SceneMode.SCENE3D,
  animation:false, timeline:false, baseLayerPicker:true,
  fullscreenButton:false, homeButton:false, sceneModePicker:false,
  geocoder:false, navigationHelpButton:false,
  infoBox:false, selectionIndicator:false,
  terrain: Cesium.Terrain.fromWorldTerrain(),
  msaaSamples: 1,
  useBrowserRecommendedResolution: false,
  requestRenderMode: false   // keep continuous render for smooth animation
});

const scene  = viewer.scene;
const camera = viewer.camera;
const ctrl   = scene.screenSpaceCameraController;

// Tune
ctrl.rotateRate = 0.25; ctrl.zoomRate = 0.35; ctrl.tiltRate = 0.15;
ctrl.minimumZoomDistance = 30;

// Disable expensive effects
scene.fog.enabled = false;
scene.globe.showGroundAtmosphere = false;
scene.highDynamicRange = false;
scene.globe.enableLighting = false;
scene.globe.maximumScreenSpaceError = 4; // reduce tile detail slightly

navigator.geolocation.getCurrentPosition(p => {
  camera.flyTo({ destination: Cesium.Cartesian3.fromDegrees(p.coords.longitude, p.coords.latitude, 1500), duration: 5 });
}, () => {});

// ═══════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════
const ALT = 50;
let coords    = [];   // { seconds, lon, lat, alt, distCum, pos3d }
let trailLen  = 200;  // max trail index count
let idx       = 0;
let playing   = false;
let speed     = 1;
let followOn  = true;
let camMode   = 0;    // 0=behind 1=cockpit 2=free
let is3D      = false;
let startAlt  = null;
let origName  = null;
let origKml   = null;
let cutActive = false;
let userMoved = false;
let moveTimer = null;
let mainChart = null;
let rafId     = null;
let lastTs    = null;
let secAcc    = 0;

// Camera offsets
const CAM_OFF   = [new Cesium.Cartesian3(0,-250,70), new Cesium.Cartesian3(0,6,1), null];
const CAM_NAMES = ['Hinter-Ansicht','Cockpit','Freie Ansicht'];

// ═══════════════════════════════════════════════════════════
// POLYLINE PRIMITIVE APPROACH
// The ghost (full route) is a static Primitive – uploaded to GPU once, never touched again.
// The trail is a Primitive that gets REBUILT only when needed (index changes),
// but we throttle rebuilds to max once per N frames.
// ═══════════════════════════════════════════════════════════
let ghostPrimitive = null;
let trailPrimitive = null;
let trailRebuildPending = false;
let lastTrailStart = -1;
let lastTrailEnd   = -1;

// Falcon entity (model)
let falconEntity = null;
const falconPos3d = new Cesium.Cartesian3();

// Reusable scratch for orientation
const _dir  = new Cesium.Cartesian3();
const _rgt  = new Cesium.Cartesian3();
const _tup  = new Cesium.Cartesian3();
const _rot  = new Cesium.Matrix3();
const _qb   = new Cesium.Quaternion();
const _qout = new Cesium.Quaternion();
const _xRot = Cesium.Quaternion.fromAxisAngle(Cesium.Cartesian3.UNIT_X, Cesium.Math.toRadians(-90));
const _tfm  = new Cesium.Matrix4();

// ═══════════════════════════════════════════════════════════
// BUILD PRIMITIVES
// ═══════════════════════════════════════════════════════════
function buildGhostPrimitive(positions) {
  if (ghostPrimitive) { scene.primitives.remove(ghostPrimitive); ghostPrimitive = null; }
  if (positions.length < 2) return;
  ghostPrimitive = scene.primitives.add(new Cesium.Primitive({
    geometryInstances: new Cesium.GeometryInstance({
      geometry: new Cesium.PolylineGeometry({
        positions,
        width: 1.5,
        vertexFormat: Cesium.PolylineColorAppearance.VERTEX_FORMAT
      }),
      attributes: {
        color: Cesium.ColorGeometryInstanceAttribute.fromColor(
          Cesium.Color.fromCssColorString('#4fa3ff').withAlpha(0.18)
        )
      }
    }),
    appearance: new Cesium.PolylineColorAppearance(),
    asynchronous: false   // build synchronously – no pop-in
  }));
}

function buildTrailPrimitive(start, end) {
  if (start === lastTrailStart && end === lastTrailEnd) return;
  lastTrailStart = start; lastTrailEnd = end;

  if (trailPrimitive) { scene.primitives.remove(trailPrimitive); trailPrimitive = null; }
  if (end - start < 2) return;

  const positions = coords.slice(start, end + 1).map(c => c.pos3d);

  trailPrimitive = scene.primitives.add(new Cesium.Primitive({
    geometryInstances: new Cesium.GeometryInstance({
      geometry: new Cesium.PolylineGeometry({
        positions,
        width: 4,
        vertexFormat: Cesium.PolylineColorAppearance.VERTEX_FORMAT
      }),
      attributes: {
        color: Cesium.ColorGeometryInstanceAttribute.fromColor(
          Cesium.Color.fromCssColorString('#4fa3ff').withAlpha(0.95)
        )
      }
    }),
    appearance: new Cesium.PolylineColorAppearance(),
    asynchronous: false
  }));
}

// ═══════════════════════════════════════════════════════════
// KML PARSER
// ═══════════════════════════════════════════════════════════
function parseKml(text) {
  const raw = []; let t = null;
  for (let line of text.split(/\r?\n/)) {
    line = line.trim();
    if (line.startsWith('<name>')) {
      const p = line.replace(/<\/?name>/g,'').trim().split(':').map(Number);
      if (p.length >= 2) t = p[0]*3600 + p[1]*60 + (p[2]||0);
    }
    if (line.includes('<coordinates>') && t !== null) {
      const cs = line.substring(line.indexOf('>')+1, line.indexOf('</coordinates>')).trim();
      const [lon,lat,alt] = cs.split(',').map(Number);
      if (!isNaN(lon)&&!isNaN(lat)&&!isNaN(alt)) raw.push({seconds:t,lon,lat,alt});
    }
  }
  if (!raw.length) return [];

  // Interpolate with fewer steps to reduce total point count
  const STEPS = 6;
  const out = [];
  for (let i = 0; i < raw.length; i++) {
    if (i === 0) {
      out.push({ ...raw[0], distCum:0, pos3d: Cesium.Cartesian3.fromDegrees(raw[0].lon, raw[0].lat, raw[0].alt+ALT) });
      continue;
    }
    const prev = raw[i-1], curr = raw[i];
    for (let s = 1; s <= STEPS; s++) {
      const f = s/STEPS;
      const lon = prev.lon+(curr.lon-prev.lon)*f;
      const lat = prev.lat+(curr.lat-prev.lat)*f;
      const alt = prev.alt+(curr.alt-prev.alt)*f;
      const seconds = prev.seconds+(curr.seconds-prev.seconds)*f;
      const last = out[out.length-1];
      const dx = (lon-last.lon)*111320*Math.cos(lat*Math.PI/180);
      const dy = (lat-last.lat)*111320;
      out.push({ seconds, lon, lat, alt,
        distCum: last.distCum + Math.sqrt(dx*dx+dy*dy),
        pos3d: Cesium.Cartesian3.fromDegrees(lon,lat,alt+ALT)
      });
    }
  }
  return out;
}

// ═══════════════════════════════════════════════════════════
// LOAD
// ═══════════════════════════════════════════════════════════
function loadKmlText(text, name) {
  origKml = text; origName = name;
  showMsg('Berechne Route…');
  setTimeout(() => {
    coords = parseKml(text);
    if (!coords.length) { hideMsg(); alert('Keine Koordinaten.'); return; }

    // Ghost: build once from ALL positions
    buildGhostPrimitive(coords.map(c => c.pos3d));
    lastTrailStart = -1; lastTrailEnd = -1;

    idx = 0; startAlt = null; playing = false;
    lastTs = null; secAcc = 0;
    cancelAnimationFrame(rafId);
    document.getElementById('playBtn').textContent = '▶';

    buildFalcon();
    buildChart();
    hideMsg();
    updateFrame(0, true);
    camera.flyTo({
      destination: Cesium.Cartesian3.fromDegrees(coords[0].lon, coords[0].lat, coords[0].alt+2500),
      duration: 2
    });
    showKeyHint();
  }, 20);
}

async function loadFromServer(url) {
  showLoading(true);
  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error('HTTP '+r.status);
    loadKmlText(await r.text(), url.split('/').pop());
  } catch(e) { alert('Fehler: '+e.message); }
  showLoading(false);
}

// ═══════════════════════════════════════════════════════════
// FALCON
// ═══════════════════════════════════════════════════════════
function buildFalcon() {
  if (falconEntity) { viewer.entities.remove(falconEntity); falconEntity = null; }
  Cesium.Cartesian3.clone(coords[0].pos3d, falconPos3d);
  falconEntity = viewer.entities.add({
    position: new Cesium.CallbackProperty(() => falconPos3d, false),
    orientation: new Cesium.CallbackProperty(computeOrientation, false),
    model: {
      uri: 'https://benne1994.github.io/Flugroute/falcon_flying.glb',
      scale: 0.9, minimumPixelSize: 32, maximumScale: 250
    }
  });
}

function computeOrientation() {
  if (idx < 1 || idx >= coords.length) return Cesium.Quaternion.IDENTITY;
  const prev = coords[idx-1], curr = coords[idx];
  Cesium.Cartesian3.subtract(curr.pos3d, prev.pos3d, _dir);
  if (Cesium.Cartesian3.magnitudeSquared(_dir) < 1e-10) return Cesium.Quaternion.IDENTITY;
  Cesium.Cartesian3.normalize(_dir, _dir);
  Cesium.Cartesian3.cross(Cesium.Cartesian3.UNIT_Z, _dir, _rgt);
  Cesium.Cartesian3.normalize(_rgt, _rgt);
  Cesium.Cartesian3.cross(_dir, _rgt, _tup);
  Cesium.Matrix3.setColumn(_rot, 0, _rgt, _rot);
  Cesium.Matrix3.setColumn(_rot, 1, _tup, _rot);
  Cesium.Matrix3.setColumn(_rot, 2, _dir, _rot);
  Cesium.Quaternion.fromRotationMatrix(_rot, _qb);
  return Cesium.Quaternion.multiply(_qb, _xRot, _qout);
}

// ═══════════════════════════════════════════════════════════
// UPDATE FRAME
// forceRebuild = true on seek/scrub, false during smooth playback
// ═══════════════════════════════════════════════════════════
// Throttle trail rebuilds: only rebuild every N index steps during playback
const TRAIL_REBUILD_STEP = 3;

function updateFrame(newIdx, forceRebuild) {
  idx = newIdx;
  const p = coords[idx];

  // Falcon: mutate in place (zero GC)
  Cesium.Cartesian3.clone(p.pos3d, falconPos3d);

  // Trail primitive: rebuild only when head has moved by TRAIL_REBUILD_STEP
  const trailStart = Math.max(0, idx - trailLen);
  const shouldRebuild = forceRebuild ||
    Math.abs(idx - lastTrailEnd) >= TRAIL_REBUILD_STEP ||
    trailStart !== lastTrailStart;
  if (shouldRebuild) buildTrailPrimitive(trailStart, idx);

  // Camera
  if (followOn && !userMoved && camMode !== 2) applyFollow(p);

  // HUD
  if (startAlt === null) startAlt = p.alt;
  let spd = 0, vario = 0;
  if (idx > 0) {
    const prev = coords[idx-1], dt = p.seconds - prev.seconds;
    if (dt > 0) {
      const dx = (p.lon-prev.lon)*111320*Math.cos(p.lat*Math.PI/180);
      const dy = (p.lat-prev.lat)*111320;
      spd   = (Math.sqrt(dx*dx+dy*dy)/dt)*3.6;
      vario = (p.alt-prev.alt)/dt;
    }
  }
  document.getElementById('iSpeed').textContent = spd.toFixed(1)+' km/h';
  document.getElementById('iAlt').textContent   = p.alt.toFixed(1)+' m';
  document.getElementById('iRel').textContent   = (p.alt-startAlt).toFixed(1)+' m';
  document.getElementById('iDist').textContent  = ((p.distCum||0)/1000).toFixed(2)+' km';
  document.getElementById('iTime').textContent  = fmtT(p.seconds);
  const ve = document.getElementById('iVario');
  ve.textContent = vario.toFixed(2)+' m/s';
  ve.className   = 'hud-val'+(vario>0.2?' up':vario<-0.2?' dn':'');

  // Progress
  document.getElementById('progressFill').style.width =
    (coords.length > 1 ? (idx/(coords.length-1))*100 : 0)+'%';
}

// ═══════════════════════════════════════════════════════════
// CAMERA
// ═══════════════════════════════════════════════════════════
function applyFollow(p) {
  if (scene.mode === Cesium.SceneMode.SCENE2D) {
    camera.setView({ destination: Cesium.Cartesian3.fromDegrees(p.lon, p.lat, camera.positionCartographic.height) });
    return;
  }
  Cesium.Transforms.eastNorthUpToFixedFrame(p.pos3d, undefined, _tfm);
  camera.lookAtTransform(_tfm, CAM_OFF[camMode]);
}
function stopFollow() { camera.lookAtTransform(Cesium.Matrix4.IDENTITY); }

scene.canvas.addEventListener('pointerdown', () => {
  if (!followOn) return;
  userMoved = true;
  clearTimeout(moveTimer);
  moveTimer = setTimeout(() => {
    userMoved = false;
    if (followOn && coords.length && camMode !== 2) applyFollow(coords[idx]);
  }, 3000);
}, { passive:true });

// ═══════════════════════════════════════════════════════════
// rAF LOOP
// ═══════════════════════════════════════════════════════════
function rafLoop(ts) {
  if (!playing) return;
  if (lastTs === null) lastTs = ts;
  const wall = (ts - lastTs) / 1000;
  lastTs = ts;
  // Cap wall time to avoid huge jumps after tab switch
  secAcc += Math.min(wall, 0.1) * speed;

  const startSec = coords[idx]?.seconds ?? 0;
  const target   = startSec + secAcc;

  // Binary search
  let lo = idx, hi = coords.length-1, ni = idx;
  while (lo <= hi) {
    const mid = (lo+hi)>>1;
    if (coords[mid].seconds <= target) { ni = mid; lo = mid+1; }
    else hi = mid-1;
  }

  if (ni !== idx) {
    secAcc -= (coords[ni].seconds - startSec);
    updateFrame(ni, false);
    updateChartMarker();
  }

  if (idx >= coords.length-1) {
    playing = false;
    document.getElementById('playBtn').textContent = '▶';
    return;
  }
  rafId = requestAnimationFrame(rafLoop);
}

function startPlay() {
  if (!coords.length) return;
  playing=true; lastTs=null; secAcc=0;
  rafId = requestAnimationFrame(rafLoop);
  document.getElementById('playBtn').textContent = '⏸';
}
function pausePlay() {
  playing=false; cancelAnimationFrame(rafId);
  document.getElementById('playBtn').textContent = '▶';
}
function scrub(secs) {
  if (!coords.length) return;
  const target = coords[idx].seconds + secs;
  let ni = idx;
  if (secs > 0) { while(ni < coords.length-1 && coords[ni].seconds < target) ni++; }
  else          { while(ni > 0 && coords[ni].seconds > target) ni--; }
  pausePlay(); updateFrame(ni, true); updateChartMarker();
}

// ═══════════════════════════════════════════════════════════
// CAMERA MODE
// ═══════════════════════════════════════════════════════════
function cycleCam() {
  camMode = (camMode+1)%3;
  if (camMode !== 2 && coords.length) { userMoved=false; applyFollow(coords[idx]); }
  else if (camMode===2) stopFollow();
  const b=document.getElementById('camBadge'); b.textContent=CAM_NAMES[camMode]; b.classList.add('show');
  setTimeout(()=>b.classList.remove('show'),2200);
}

// ═══════════════════════════════════════════════════════════
// CHART
// ═══════════════════════════════════════════════════════════
function buildChart() {
  const ctx = document.getElementById('mainChart').getContext('2d');
  const seconds = coords.map(c=>c.seconds);
  const alts    = coords.map(c=>c.alt);
  const speeds  = coords.map((c,i)=>{
    if(!i) return 0;
    const prev=coords[i-1], dt=c.seconds-prev.seconds;
    if(dt<=0) return 0;
    const dx=(c.lon-prev.lon)*111320*Math.cos(c.lat*Math.PI/180);
    const dy=(c.lat-prev.lat)*111320;
    return(Math.sqrt(dx*dx+dy*dy)/dt)*3.6;
  });
  if (mainChart) mainChart.destroy();
  mainChart = new Chart(ctx, {
    type:'line',
    data:{ labels:seconds,
      datasets:[
        {label:'Höhe (m)',data:alts,borderColor:'#4fa3ff',borderWidth:1.5,backgroundColor:'rgba(79,163,255,.1)',fill:true,yAxisID:'y1',pointRadius:0,tension:.3},
        {label:'Speed (km/h)',data:speeds,borderColor:'#00e5a0',borderWidth:1.5,fill:false,yAxisID:'y2',pointRadius:0,tension:.3}
      ]
    },
    options:{
      responsive:true,maintainAspectRatio:false,animation:false,
      plugins:{
        legend:{labels:{color:'#6a88aa',font:{family:'Rajdhani',size:11},boxWidth:12}},
        annotation:{annotations:{
          cursor:{type:'line',xMin:seconds[0],xMax:seconds[0],borderColor:'#ff4f6a',borderWidth:2,
            label:{display:true,content:()=>fmtT(coords[idx]?.seconds??0),backgroundColor:'#ff4f6a',color:'#fff',font:{family:'JetBrains Mono',size:10},position:'start',padding:4}},
          cutStart:{type:'line',xMin:seconds[0],xMax:seconds[0],borderColor:'#4fa3ff',borderWidth:2,display:false,label:{display:true,content:'Start',backgroundColor:'#4fa3ff',color:'#fff'}},
          cutEnd:{type:'line',xMin:seconds.at(-1),xMax:seconds.at(-1),borderColor:'#00e5a0',borderWidth:2,display:false,label:{display:true,content:'Ende',backgroundColor:'#00e5a0',color:'#fff'}}
        }}
      },
      onClick:(ev)=>{
        const pts=mainChart.getElementsAtEventForMode(ev,'nearest',{intersect:false},false);
        if(pts.length){pausePlay();updateFrame(pts[0].index,true);updateChartMarker();}
      },
      scales:{
        x:{type:'linear',ticks:{color:'#6a88aa',font:{family:'JetBrains Mono',size:9},callback:v=>fmtT(v),maxTicksLimit:8},grid:{color:'rgba(255,255,255,.04)'}},
        y1:{type:'linear',position:'left',title:{display:true,text:'Höhe (m)',color:'#4fa3ff',font:{size:10}},ticks:{color:'#4fa3ff',font:{size:9}},grid:{color:'rgba(255,255,255,.04)'}},
        y2:{type:'linear',position:'right',title:{display:true,text:'km/h',color:'#00e5a0',font:{size:10}},ticks:{color:'#00e5a0',font:{size:9}},grid:{drawOnChartArea:false}}
      }
    }
  });
}
function updateChartMarker() {
  if(!mainChart||!coords.length) return;
  const a=mainChart.options.plugins.annotation.annotations.cursor;
  a.xMin=a.xMax=coords[idx]?.seconds??0; mainChart.update('none');
}

// Touch drag on chart for cut markers
let dragCut=null;
document.getElementById('mainChart').addEventListener('touchstart',e=>{
  if(!cutActive||!mainChart) return;
  const x=e.touches[0].clientX-mainChart.canvas.getBoundingClientRect().left;
  const a=mainChart.options.plugins.annotation.annotations;
  const sp=mainChart.scales.x.getPixelForValue(a.cutStart.xMin);
  const ep=mainChart.scales.x.getPixelForValue(a.cutEnd.xMin);
  dragCut=Math.abs(x-sp)<28?'start':Math.abs(x-ep)<28?'end':null;
},{passive:true});
document.addEventListener('touchmove',e=>{
  if(!dragCut||!mainChart) return;
  const x=e.touches[0].clientX-mainChart.canvas.getBoundingClientRect().left;
  const t=mainChart.scales.x.getValueForPixel(x);
  const k=dragCut==='start'?'cutStart':'cutEnd';
  mainChart.options.plugins.annotation.annotations[k].xMin=t;
  mainChart.options.plugins.annotation.annotations[k].xMax=t;
  mainChart.update('none');
},{passive:true});
document.addEventListener('touchend',()=>dragCut=null);

// ═══════════════════════════════════════════════════════════
// CUT
// ═══════════════════════════════════════════════════════════
function activateCut() {
  if(!mainChart||!coords.length) return;
  cutActive=true; document.getElementById('cutBtn').classList.add('active');
  const a=mainChart.options.plugins.annotation.annotations;
  const s=coords.map(c=>c.seconds);
  a.cutStart.display=a.cutEnd.display=true;
  a.cutStart.xMin=a.cutStart.xMax=s[Math.floor(s.length*.1)];
  a.cutEnd.xMin=a.cutEnd.xMax=s[Math.floor(s.length*.9)];
  mainChart.update('none');
}
function applyCut() {
  if(!cutActive||!mainChart) return;
  const a=mainChart.options.plugins.annotation.annotations;
  coords=coords.filter(c=>c.seconds>=a.cutStart.xMin&&c.seconds<=a.cutEnd.xMin);
  if(!coords.length){alert('Kein Bereich.');return;}
  buildGhostPrimitive(coords.map(c=>c.pos3d));
  lastTrailStart=-1; lastTrailEnd=-1;
  startAlt=null; idx=0; cutActive=false;
  document.getElementById('cutBtn').classList.remove('active');
  buildChart(); updateFrame(0,true);
  document.getElementById('dCutUpload').classList.add('open');
}

// ═══════════════════════════════════════════════════════════
// PROGRESS BAR
// ═══════════════════════════════════════════════════════════
document.getElementById('progressBar').addEventListener('click',e=>{
  if(!coords.length) return;
  const ni=Math.round((e.offsetX/e.currentTarget.offsetWidth)*(coords.length-1));
  pausePlay(); updateFrame(ni,true); updateChartMarker();
});

document.getElementById('trailSlider').oninput=e=>{
  trailLen=parseInt(e.target.value);
  lastTrailStart=-1; // force rebuild
  if(coords.length) updateFrame(idx,true);
};

// ═══════════════════════════════════════════════════════════
// SUPABASE
// ═══════════════════════════════════════════════════════════
async function listFiles() {
  const L=document.getElementById('serverFileList');
  L.innerHTML='<p style="color:var(--text-dim);font-size:.85rem;padding:8px">Lade…</p>';
  const{data,error}=await supabase.storage.from('flugspuren').list();
  if(error){L.innerHTML='<p style="color:var(--danger)">'+error.message+'</p>';return;}
  L.innerHTML='';
  (data||[]).forEach(f=>{
    const row=document.createElement('div'); row.className='sfr';
    const nm=document.createElement('span'); nm.className='sfn'; nm.textContent=f.name;
    nm.onclick=async()=>{
      document.getElementById('dServer').classList.remove('open');
      const{data:u}=await supabase.storage.from('flugspuren').createSignedUrl(f.name,3600);
      if(u?.signedUrl) loadFromServer(u.signedUrl);
    };
    const dl=document.createElement('button'); dl.className='sfa'; dl.textContent='🗑';
    dl.onclick=async()=>{
      if(!confirm('Löschen: "'+f.name+'"?')) return;
      const{error:e}=await supabase.storage.from('flugspuren').remove([f.name]);
      if(e) alert(e.message); else listFiles();
    };
    row.appendChild(nm); row.appendChild(dl); L.appendChild(row);
  });
  if(!data?.length) L.innerHTML='<p style="color:var(--text-dim);font-size:.85rem;padding:8px">Keine Dateien.</p>';
}
async function uploadCurrent(name) {
  const blob=new Blob([buildKml()],{type:'application/vnd.google-earth.kml+xml'});
  const{error}=await supabase.storage.from('flugspuren').upload(name,new File([blob],name),{upsert:true});
  if(error) alert('Fehler: '+error.message); else alert('Gespeichert: '+name);
}

// ═══════════════════════════════════════════════════════════
// KML EXPORT
// ═══════════════════════════════════════════════════════════
function buildKml() {
  let k=`<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2">\n  <Document>\n`;
  for(const c of coords){
    if(!Number.isInteger(c.seconds)) continue;
    k+=`    <Placemark>\n      <name>${fmtT(c.seconds)}</name>\n      <Point>\n        <coordinates>${c.lon},${c.lat},${c.alt}</coordinates>\n      </Point>\n    </Placemark>\n`;
  }
  return k+`  </Document>\n</kml>`;
}
function saveLocal() {
  if(!coords.length){alert('Keine Daten.');return;}
  const a=Object.assign(document.createElement('a'),{
    href:URL.createObjectURL(new Blob([buildKml()],{type:'application/vnd.google-earth.kml+xml'})),
    download:(origName||'flugroute').replace('.kml','_export.kml')
  });
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

// ═══════════════════════════════════════════════════════════
// CHART RESIZE
// ═══════════════════════════════════════════════════════════
const cp=document.getElementById('chartPanel'),ch=document.getElementById('chartHandle');
let rsz=false,rsY=0,rsH=0;
ch.addEventListener('pointerdown',e=>{rsz=true;rsY=e.clientY;rsH=cp.offsetHeight;ch.setPointerCapture(e.pointerId);});
ch.addEventListener('pointermove',e=>{if(!rsz)return;cp.style.height=Math.max(80,Math.min(window.innerHeight*.7,rsH+(rsY-e.clientY)))+'px';});
ch.addEventListener('pointerup',()=>rsz=false);

// ═══════════════════════════════════════════════════════════
// KEYBOARD
// ═══════════════════════════════════════════════════════════
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT') return;
  switch(e.code){
    case'Space': e.preventDefault(); playing?pausePlay():startPlay(); break;
    case'ArrowRight': scrub(10);  break;
    case'ArrowLeft':  scrub(-10); break;
    case'ArrowUp':    scrub(60);  break;
    case'ArrowDown':  scrub(-60); break;
    case'KeyC': cycleCam(); break;
    case'KeyF':
      followOn=!followOn;
      document.getElementById('followBtn').classList.toggle('active',followOn);
      document.getElementById('followIndicator').classList.toggle('show',followOn);
      if(!followOn) stopFollow();
      else if(coords.length){userMoved=false;applyFollow(coords[idx]);}
      break;
  }
});

// ═══════════════════════════════════════════════════════════
// BUTTONS
// ═══════════════════════════════════════════════════════════
document.getElementById('playBtn').onclick   = ()=>playing?pausePlay():startPlay();
document.getElementById('camModeBtn').onclick = cycleCam;
document.getElementById('fsBtn').onclick     = ()=>{ if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{}); else document.exitFullscreen(); };
document.getElementById('switchView').onclick = ()=>{
  is3D=!is3D;
  scene.mode=is3D?Cesium.SceneMode.SCENE2D:Cesium.SceneMode.SCENE3D;
  document.getElementById('switchView').textContent=is3D?'3D':'2D';
  if(!is3D) Cesium.createWorldTerrainAsync().then(t=>viewer.terrainProvider=t);
};
document.getElementById('openFile').onclick    = ()=>document.getElementById('dFile').classList.add('open');
document.getElementById('dFileCancel').onclick = ()=>document.getElementById('dFile').classList.remove('open');
document.getElementById('dLoadLocal').onclick  = ()=>{ document.getElementById('dFile').classList.remove('open'); setTimeout(()=>{const f=document.getElementById('fileInput');f.value='';f.click();},80); };
document.getElementById('dLoadServer').onclick = ()=>{ document.getElementById('dFile').classList.remove('open'); document.getElementById('dServer').classList.add('open'); listFiles(); };
document.getElementById('dServerCancel').onclick = ()=>document.getElementById('dServer').classList.remove('open');
document.getElementById('dUpload').onclick = ()=>{
  document.getElementById('dFile').classList.remove('open');
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.kml';
  inp.onchange=async e=>{
    const f=e.target.files[0]; if(!f) return;
    const n=prompt('Dateiname:',f.name)||f.name; showLoading(true);
    const{error}=await supabase.storage.from('flugspuren').upload(n,new File([f],n,{type:f.type}),{upsert:true});
    showLoading(false);
    if(error) alert(error.message); else alert('Hochgeladen: '+n);
  };
  inp.click();
};
document.getElementById('dSaveLocal').onclick  = ()=>{ document.getElementById('dFile').classList.remove('open'); saveLocal(); };
document.getElementById('fileInput').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return;
  (function(fr){fr.onload=ev=>loadKmlText(ev.target.result,f.name);fr.readAsText(f);}(new FileReader()));
});
document.getElementById('followBtn').onclick = ()=>{
  followOn=!followOn;
  document.getElementById('followBtn').classList.toggle('active',followOn);
  document.getElementById('followIndicator').classList.toggle('show',followOn);
  if(!followOn) stopFollow(); else if(coords.length){userMoved=false;applyFollow(coords[idx]);}
};
const spVals=[1,2,4,8,16]; let spIdx=0;
document.getElementById('speedBtn').onclick=()=>{
  spIdx=(spIdx+1)%spVals.length; speed=spVals[spIdx];
  document.getElementById('speedBtn').textContent=speed+'×';
};
document.getElementById('cutBtn').onclick=()=>cutActive?applyCut():activateCut();
document.getElementById('dCutYes').onclick=async()=>{
  document.getElementById('dCutUpload').classList.remove('open');
  const n=prompt('Dateiname:',(origName||'cut').replace('.kml','_schnitt.kml'));
  if(n) await uploadCurrent(n);
};
document.getElementById('dCutNo').onclick=()=>{ document.getElementById('dCutUpload').classList.remove('open'); saveLocal(); };

// ═══════════════════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════════════════
function fmtT(s){const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),ss=Math.floor(s%60);return h?`${h}:${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`:`${m}:${String(ss).padStart(2,'0')}`;}
function showLoading(on){const b=document.getElementById('loadingBar');b.style.display=on?'block':'none';b.style.width=on?'70%':'100%';if(!on)setTimeout(()=>b.style.display='none',350);}
function showMsg(t){const m=document.getElementById('loadingMsg');m.textContent='⏳ '+t;m.style.display='block';}
function hideMsg(){document.getElementById('loadingMsg').style.display='none';}
function showKeyHint(){const h=document.getElementById('keyHint');h.classList.add('show');setTimeout(()=>h.classList.remove('show'),4500);}

document.getElementById('followIndicator').classList.toggle('show',followOn);
</script>
</body>
</html>
