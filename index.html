<script>
// ═══════════════════════════════════════════════════════
//  CESIUM INIT
// ═══════════════════════════════════════════════════════
Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiI5ZTI3MDRmMy1mYjg5LTRjNmYtYjBmZC1kZDQxN2NlNzVkZDEiLCJpZCI6Mjk3NzA1LCJpYXQiOjE3NDU5MzE5MTh9.svRycz7t606srY9WbWiWUaLB2hJpycWmo835Dy-VWtw';

const viewer = new Cesium.Viewer('cesiumContainer', {
  sceneMode: Cesium.SceneMode.SCENE3D,
  animation: false, timeline: false,
  baseLayerPicker: true, fullscreenButton: false,
  homeButton: false, sceneModePicker: false,
  geocoder: false, navigationHelpButton: false,
  infoBox: false, selectionIndicator: false,
  terrain: Cesium.Terrain.fromWorldTerrain()
});

const scene = viewer.scene;
const camera = viewer.camera;
const controller = scene.screenSpaceCameraController;
controller.rotateRate = 0.3;
controller.zoomRate   = 0.4;
controller.tiltRate   = 0.2;

// Fly to user location on start
navigator.geolocation.getCurrentPosition(pos => {
  camera.flyTo({
    destination: Cesium.Cartesian3.fromDegrees(pos.coords.longitude, pos.coords.latitude, (pos.coords.altitude || 0) + 1000),
    duration: 8
  });
}, () => {});

// ═══════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════
const ALT_OFFSET = 50;

let fullCoords      = [];   // { seconds, lon, lat, alt, distCum }
let animationIndex  = 0;
let isPlaying       = false;
let speedFactor     = 1;
let trailSeconds    = 3000;
let followEnabled   = true;
let is3D            = false;
let startAltitude   = null;
let originalFileName = null;
let originalKmlContent = null;
let cutModeActive   = false;

let movingPointEntity  = null;
let followTransform    = null;
let mainChart          = null;

// rAF animation
let rafId       = null;
let lastRafTime = null;
let secondsAccum = 0;   // accumulated simulated seconds

// Quad trail
let quadEntities  = [];
const MAX_QUADS   = 60;
let lastQuadIdx   = -1;

// ═══════════════════════════════════════════════════════
//  TRAIL POLYLINE (CallbackProperty – no re-add needed)
// ═══════════════════════════════════════════════════════
const trailPositions = new Cesium.CallbackProperty(() => {
  if (!fullCoords.length) return [];
  const t = fullCoords[animationIndex]?.seconds ?? 0;
  const minT = t - trailSeconds;
  const trail = [];
  for (let i = animationIndex; i >= 0; i--) {
    if (fullCoords[i].seconds < minT) break;
    trail.unshift(fullCoords[i]);
  }
  return Cesium.Cartesian3.fromDegreesArrayHeights(
    trail.flatMap(p => [p.lon, p.lat, p.alt + ALT_OFFSET])
  );
}, false);

viewer.entities.add({
  polyline: {
    positions: trailPositions,
    width: 4,
    material: new Cesium.ColorMaterialProperty(Cesium.Color.fromCssColorString('#4fa3ff').withAlpha(0.95))
  }
});

// ═══════════════════════════════════════════════════════
//  PARSE KML
// ═══════════════════════════════════════════════════════
function parseKml(text) {
  const lines = text.split(/\r?\n/);
  const raw = [];
  let currentTime = null;

  for (let line of lines) {
    line = line.trim();
    if (line.startsWith('<name>')) {
      const parts = line.replace(/<\/?name>/g, '').trim().split(':').map(Number);
      if (parts.length >= 2) {
        const [h, m, s = 0] = parts;
        currentTime = h * 3600 + m * 60 + s;
      }
    }
    if (line.includes('<coordinates>') && currentTime !== null) {
      const coordStr = line.substring(line.indexOf('>') + 1, line.indexOf('</coordinates>')).trim();
      const [lon, lat, alt] = coordStr.split(',').map(Number);
      if (!isNaN(lon) && !isNaN(lat) && !isNaN(alt)) {
        raw.push({ seconds: currentTime, lon, lat, alt });
      }
    }
  }

  if (!raw.length) return [];

  // Interpolate between raw points (10 sub-steps) + pre-compute cumulative distance
  const coords = [];
  const STEPS = 10;

  for (let i = 0; i < raw.length; i++) {
    if (i === 0) {
      coords.push({ ...raw[0], distCum: 0 });
      continue;
    }
    const prev = raw[i - 1];
    const curr = raw[i];
    for (let s = 1; s <= STEPS; s++) {
      const t = s / STEPS;
      const lon = prev.lon + (curr.lon - prev.lon) * t;
      const lat = prev.lat + (curr.lat - prev.lat) * t;
      const alt = prev.alt + (curr.alt - prev.alt) * t;
      const seconds = prev.seconds + (curr.seconds - prev.seconds) * t;

      const last = coords[coords.length - 1];
      const dx = (lon - last.lon) * 111320 * Math.cos(lat * Math.PI / 180);
      const dy = (lat - last.lat) * 111320;
      const distStep = Math.sqrt(dx * dx + dy * dy);
      coords.push({ seconds, lon, lat, alt, distCum: last.distCum + distStep });
    }
  }

  return coords;
}

// ═══════════════════════════════════════════════════════
//  LOAD KML (local or remote text)
// ═══════════════════════════════════════════════════════
function loadKmlText(text, filename) {
  originalKmlContent = text;
  originalFileName   = filename;
  fullCoords = parseKml(text);
  if (!fullCoords.length) { alert('Keine gültigen Koordinaten gefunden.'); return; }

  animationIndex = 0;
  startAltitude  = null;
  isPlaying      = false;
  lastRafTime    = null;
  secondsAccum   = 0;
  cancelAnimationFrame(rafId);
  document.getElementById('togglePlayBtn').textContent = '▶';

  // Clear old quads
  quadEntities.forEach(e => viewer.entities.remove(e));
  quadEntities = [];
  lastQuadIdx  = -1;

  updatePoint(0);
  buildChart();

  // Fly to start
  camera.flyTo({
    destination: Cesium.Cartesian3.fromDegrees(fullCoords[0].lon, fullCoords[0].lat, fullCoords[0].alt + 2000),
    duration: 2
  });
}

async function loadFromServer(url) {
  showLoading(true);
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    loadKmlText(text, url.split('/').pop());
  } catch (e) {
    alert('Fehler beim Laden: ' + e.message);
  }
  showLoading(false);
}

// ═══════════════════════════════════════════════════════
//  UPDATE POINT (called each animation step)
// ═══════════════════════════════════════════════════════
function updatePoint(idx) {
  animationIndex = idx;
  const p   = fullCoords[idx];
  const pos = Cesium.Cartesian3.fromDegrees(p.lon, p.lat, p.alt + ALT_OFFSET);

  // ── Moving entity ──
  if (!movingPointEntity) {
    movingPointEntity = viewer.entities.add({
      position: pos,
      orientation: buildOrientation(),
      model: {
        uri: 'https://benne1994.github.io/Flugroute/falcon_flying.glb',
        scale: 0.9,
        minimumPixelSize: 32,
        maximumScale: 200
      }
    });
  } else {
    movingPointEntity.position = new Cesium.ConstantPositionProperty(pos);
  }

  // ── Follow camera ──
  if (followEnabled) doFollow(p, pos);

  // ── HUD ──
  if (startAltitude === null) startAltitude = p.alt;

  let speedKmh = 0, climbRate = 0;
  if (idx > 0) {
    const prev = fullCoords[idx - 1];
    const dt   = p.seconds - prev.seconds;
    if (dt > 0) {
      const dx = (p.lon - prev.lon) * 111320 * Math.cos(p.lat * Math.PI / 180);
      const dy = (p.lat - prev.lat) * 111320;
      speedKmh  = (Math.sqrt(dx * dx + dy * dy) / dt) * 3.6;
      climbRate = (p.alt - prev.alt) / dt;
    }
  }

  document.getElementById('infoSpeed').textContent    = speedKmh.toFixed(1) + ' km/h';
  document.getElementById('infoAlt').textContent      = p.alt.toFixed(1) + ' m';
  document.getElementById('infoRelAlt').textContent   = (p.alt - startAltitude).toFixed(1) + ' m';
  document.getElementById('infoDistance').textContent = ((p.distCum ?? 0) / 1000).toFixed(2) + ' km';

  const varioEl = document.getElementById('infoVario');
  varioEl.textContent = climbRate.toFixed(2) + ' m/s';
  varioEl.className   = 'hud-val' + (climbRate > 0.2 ? ' climb-pos' : climbRate < -0.2 ? ' climb-neg' : '');
}

function buildOrientation() {
  return new Cesium.CallbackProperty(() => {
    if (animationIndex === 0 || animationIndex >= fullCoords.length) return Cesium.Quaternion.IDENTITY;
    const prev = fullCoords[Math.max(0, animationIndex - 1)];
    const curr = fullCoords[animationIndex];
    const from = Cesium.Cartesian3.fromDegrees(prev.lon, prev.lat, prev.alt + ALT_OFFSET);
    const to   = Cesium.Cartesian3.fromDegrees(curr.lon, curr.lat, curr.alt + ALT_OFFSET);
    const dir  = Cesium.Cartesian3.subtract(to, from, new Cesium.Cartesian3());
    if (Cesium.Cartesian3.magnitude(dir) < 1e-6) return Cesium.Quaternion.IDENTITY;
    Cesium.Cartesian3.normalize(dir, dir);

    const up    = Cesium.Cartesian3.UNIT_Z;
    const right = Cesium.Cartesian3.normalize(Cesium.Cartesian3.cross(up, dir, new Cesium.Cartesian3()), new Cesium.Cartesian3());
    const trueUp = Cesium.Cartesian3.cross(dir, right, new Cesium.Cartesian3());
    const rot = new Cesium.Matrix3();
    Cesium.Matrix3.setColumn(rot, 0, right, rot);
    Cesium.Matrix3.setColumn(rot, 1, trueUp, rot);
    Cesium.Matrix3.setColumn(rot, 2, dir, rot);
    const base = Cesium.Quaternion.fromRotationMatrix(rot);
    const xRot = Cesium.Quaternion.fromAxisAngle(Cesium.Cartesian3.UNIT_X, Cesium.Math.toRadians(-90));
    const yRot = Cesium.Quaternion.fromAxisAngle(Cesium.Cartesian3.UNIT_Y, 0);
    const corr = Cesium.Quaternion.multiply(xRot, yRot, new Cesium.Quaternion());
    return Cesium.Quaternion.multiply(base, corr, new Cesium.Quaternion());
  }, false);
}

// ═══════════════════════════════════════════════════════
//  CAMERA FOLLOW
// ═══════════════════════════════════════════════════════
function doFollow(p, pos) {
  if (scene.mode === Cesium.SceneMode.SCENE3D) {
    followTransform = Cesium.Transforms.eastNorthUpToFixedFrame(pos);
    const camOffset = followTransform
      ? viewer.camera.position
      : new Cesium.Cartesian3(0, -1000, 500);
    camera.lookAtTransform(followTransform, followTransform ? camOffset : new Cesium.Cartesian3(0, -1000, 500));
  } else {
    const h = camera.positionCartographic.height;
    camera.setView({ destination: Cesium.Cartesian3.fromDegrees(p.lon, p.lat, h) });
  }
}

function stopFollow() {
  camera.lookAtTransform(Cesium.Matrix4.IDENTITY);
}

// ═══════════════════════════════════════════════════════
//  VERTICAL QUAD (shadow under flight path)
// ═══════════════════════════════════════════════════════
async function maybeAddQuad(idx) {
  if (idx <= 0 || idx === lastQuadIdx) return;
  lastQuadIdx = idx;

  const p1 = fullCoords[idx - 1];
  const p2 = fullCoords[idx];

  const cartos = [
    Cesium.Cartographic.fromDegrees(p1.lon, p1.lat),
    Cesium.Cartographic.fromDegrees(p2.lon, p2.lat)
  ];

  try {
    const updated = await Cesium.sampleTerrainMostDetailed(viewer.terrainProvider, cartos);
    const g1 = updated[0].height ?? 0;
    const g2 = updated[1].height ?? 0;

    const top1    = Cesium.Cartesian3.fromDegrees(p1.lon, p1.lat, p1.alt + ALT_OFFSET);
    const top2    = Cesium.Cartesian3.fromDegrees(p2.lon, p2.lat, p2.alt + ALT_OFFSET);
    const ground1 = Cesium.Cartesian3.fromDegrees(p1.lon, p1.lat, g1);
    const ground2 = Cesium.Cartesian3.fromDegrees(p2.lon, p2.lat, g2);

    const ent = viewer.entities.add({
      polygon: {
        hierarchy: new Cesium.PolygonHierarchy([top1, top2, ground2, ground1]),
        material: Cesium.Color.fromCssColorString('#4fa3ff').withAlpha(0.12),
        perPositionHeight: true
      }
    });
    quadEntities.push(ent);

    // Fade older quads
    quadEntities.forEach((e, i) => {
      const alpha = 0.04 + (i / quadEntities.length) * 0.22;
      e.polygon.material = Cesium.Color.fromCssColorString('#4fa3ff').withAlpha(alpha);
    });

    if (quadEntities.length > MAX_QUADS) {
      viewer.entities.remove(quadEntities.shift());
    }
  } catch (_) {}
}

// ═══════════════════════════════════════════════════════
//  rAF-BASED ANIMATION (no setInterval = smooth!)
// ═══════════════════════════════════════════════════════
function rafLoop(timestamp) {
  if (!isPlaying) return;

  if (lastRafTime === null) lastRafTime = timestamp;
  const wallDelta = (timestamp - lastRafTime) / 1000; // real seconds elapsed
  lastRafTime = timestamp;

  // How many simulated seconds to advance
  secondsAccum += wallDelta * speedFactor;

  // Advance animationIndex by simulated time
  const startSec = fullCoords[animationIndex]?.seconds ?? 0;
  let   targetSec = startSec + secondsAccum;

  // Find next index matching targetSec
  let newIdx = animationIndex;
  while (newIdx < fullCoords.length - 1 && fullCoords[newIdx + 1].seconds <= targetSec) {
    newIdx++;
  }

  if (newIdx !== animationIndex) {
    secondsAccum -= (fullCoords[newIdx].seconds - startSec);
    updatePoint(newIdx);
    updateChartMarker();

    // Add quad every ~5 real indices
    if (newIdx % 5 === 0) maybeAddQuad(newIdx);
  }

  if (animationIndex >= fullCoords.length - 1) {
    isPlaying = false;
    document.getElementById('togglePlayBtn').textContent = '▶';
    return;
  }

  rafId = requestAnimationFrame(rafLoop);
}

function startAnimation() {
  if (!fullCoords.length) return;
  isPlaying    = true;
  lastRafTime  = null;
  secondsAccum = 0;
  rafId = requestAnimationFrame(rafLoop);
  document.getElementById('togglePlayBtn').textContent = '⏸';
}

function pauseAnimation() {
  isPlaying = false;
  cancelAnimationFrame(rafId);
  document.getElementById('togglePlayBtn').textContent = '▶';
}

// ═══════════════════════════════════════════════════════
//  CHART
// ═══════════════════════════════════════════════════════
function buildChart() {
  const ctx = document.getElementById('mainChart').getContext('2d');

  const seconds = fullCoords.map(p => p.seconds);
  const alts    = fullCoords.map(p => p.alt);
  const speeds  = fullCoords.map((p, i) => {
    if (i === 0) return 0;
    const prev = fullCoords[i - 1];
    const dt   = p.seconds - prev.seconds;
    if (dt <= 0) return 0;
    const dx = (p.lon - prev.lon) * 111320 * Math.cos(p.lat * Math.PI / 180);
    const dy = (p.lat - prev.lat) * 111320;
    return (Math.sqrt(dx*dx + dy*dy) / dt) * 3.6;
  });

  if (mainChart) mainChart.destroy();

  mainChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: seconds,
      datasets: [
        {
          label: 'Höhe (m)', data: alts,
          borderColor: '#4fa3ff', borderWidth: 1.5,
          backgroundColor: 'rgba(79,163,255,0.08)',
          fill: true, yAxisID: 'y1', pointRadius: 0, tension: 0.3
        },
        {
          label: 'Speed (km/h)', data: speeds,
          borderColor: '#00e5a0', borderWidth: 1.5,
          backgroundColor: 'transparent',
          fill: false, yAxisID: 'y2', pointRadius: 0, tension: 0.3
        }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      animation: false,
      plugins: {
        legend: {
          labels: { color: '#7a90b0', font: { family: 'Rajdhani', size: 11 }, boxWidth: 12 }
        },
        annotation: {
          annotations: {
            cursor: {
              type: 'line',
              xMin: seconds[0], xMax: seconds[0],
              borderColor: '#ff4f6a', borderWidth: 2,
              label: {
                display: true,
                content: () => fmtTime(fullCoords[animationIndex]?.seconds ?? 0),
                backgroundColor: '#ff4f6a',
                color: '#fff',
                font: { family: 'JetBrains Mono', size: 10 },
                position: 'start', padding: 4
              }
            },
            cutStart: {
              type: 'line', xMin: seconds[0], xMax: seconds[0],
              borderColor: '#4fa3ff', borderWidth: 2, display: false,
              label: { display: true, content: 'Start', backgroundColor: '#4fa3ff', color: '#fff' }
            },
            cutEnd: {
              type: 'line', xMin: seconds.at(-1), xMax: seconds.at(-1),
              borderColor: '#00e5a0', borderWidth: 2, display: false,
              label: { display: true, content: 'Ende', backgroundColor: '#00e5a0', color: '#fff' }
            }
          }
        }
      },
      onClick: (event) => {
        const pts = mainChart.getElementsAtEventForMode(event, 'nearest', { intersect: false }, false);
        if (pts.length) {
          pauseAnimation();
          updatePoint(pts[0].index);
          updateChartMarker();
        }
      },
      scales: {
        x: {
          type: 'linear',
          ticks: {
            color: '#7a90b0',
            font: { family: 'JetBrains Mono', size: 9 },
            callback: v => fmtTime(v),
            maxTicksLimit: 8
          },
          grid: { color: 'rgba(255,255,255,0.04)' }
        },
        y1: {
          type: 'linear', position: 'left',
          title: { display: true, text: 'Höhe (m)', color: '#4fa3ff', font: { size: 10 } },
          ticks: { color: '#4fa3ff', font: { size: 9 } },
          grid: { color: 'rgba(255,255,255,0.04)' }
        },
        y2: {
          type: 'linear', position: 'right',
          title: { display: true, text: 'km/h', color: '#00e5a0', font: { size: 10 } },
          ticks: { color: '#00e5a0', font: { size: 9 } },
          grid: { drawOnChartArea: false }
        }
      }
    }
  });
}

function updateChartMarker() {
  if (!mainChart || !fullCoords.length) return;
  const s = fullCoords[animationIndex]?.seconds ?? 0;
  const ann = mainChart.options.plugins.annotation.annotations.cursor;
  ann.xMin = ann.xMax = s;
  mainChart.update('none');
}

// Touch drag on chart for cut markers
let draggingCut = null;
document.getElementById('mainChart').addEventListener('touchstart', e => {
  if (!cutModeActive || !mainChart) return;
  const touch = e.touches[0];
  const rect  = mainChart.canvas.getBoundingClientRect();
  const x     = touch.clientX - rect.left;
  const ann   = mainChart.options.plugins.annotation.annotations;
  const startPx = mainChart.scales.x.getPixelForValue(ann.cutStart.xMin);
  const endPx   = mainChart.scales.x.getPixelForValue(ann.cutEnd.xMin);
  draggingCut = Math.abs(x - startPx) < 24 ? 'start' : Math.abs(x - endPx) < 24 ? 'end' : null;
}, { passive: true });

document.addEventListener('touchmove', e => {
  if (!draggingCut || !mainChart) return;
  const touch = e.touches[0];
  const rect  = mainChart.canvas.getBoundingClientRect();
  const time  = mainChart.scales.x.getValueForPixel(touch.clientX - rect.left);
  const key   = draggingCut === 'start' ? 'cutStart' : 'cutEnd';
  mainChart.options.plugins.annotation.annotations[key].xMin = time;
  mainChart.options.plugins.annotation.annotations[key].xMax = time;
  mainChart.update('none');
}, { passive: true });

document.addEventListener('touchend', () => { draggingCut = null; });

// ═══════════════════════════════════════════════════════
//  CUT MODE
// ═══════════════════════════════════════════════════════
function activateCutMode() {
  if (!mainChart || !fullCoords.length) return;
  cutModeActive = true;
  document.getElementById('cutModeBtn').classList.add('active');
  const ann = mainChart.options.plugins.annotation.annotations;
  const s   = fullCoords.map(p => p.seconds);
  ann.cutStart.display = ann.cutEnd.display = true;
  ann.cutStart.xMin = ann.cutStart.xMax = s[Math.floor(s.length * 0.1)];
  ann.cutEnd.xMin   = ann.cutEnd.xMax   = s[Math.floor(s.length * 0.9)];
  mainChart.update('none');
}

function applyCut() {
  if (!cutModeActive || !mainChart) return;
  const ann    = mainChart.options.plugins.annotation.annotations;
  const tStart = ann.cutStart.xMin;
  const tEnd   = ann.cutEnd.xMin;
  fullCoords   = fullCoords.filter(p => p.seconds >= tStart && p.seconds <= tEnd);
  if (!fullCoords.length) { alert('Kein Bereich übrig.'); return; }
  startAltitude  = null;
  animationIndex = 0;
  cutModeActive  = false;
  document.getElementById('cutModeBtn').classList.remove('active');
  buildChart();
  updatePoint(0);
  document.getElementById('cutUploadOverlay').classList.add('open');
}

// ═══════════════════════════════════════════════════════
//  SUPABASE
// ═══════════════════════════════════════════════════════
async function listSupabaseFiles() {
  const list = document.getElementById('serverFileList');
  list.innerHTML = '<p style="color:var(--text-dim);font-size:0.85rem;padding:8px">Lade…</p>';
  const { data, error } = await supabase.storage.from('flugspuren').list();
  if (error) { list.innerHTML = '<p style="color:var(--danger)">Fehler: ' + error.message + '</p>'; return; }

  list.innerHTML = '';
  (data || []).forEach(file => {
    const row = document.createElement('div');
    row.className = 'server-file-row';

    const name = document.createElement('span');
    name.className   = 'server-file-name';
    name.textContent = file.name;
    name.onclick     = async () => {
      document.getElementById('serverFileOverlay').classList.remove('open');
      const { data: urlData } = await supabase.storage.from('flugspuren').createSignedUrl(file.name, 3600);
      if (urlData?.signedUrl) loadFromServer(urlData.signedUrl);
    };

    const delBtn = document.createElement('button');
    delBtn.className   = 'server-file-action';
    delBtn.textContent = '🗑';
    delBtn.title       = 'Löschen';
    delBtn.onclick     = async () => {
      if (!confirm('Datei "' + file.name + '" löschen?')) return;
      const { error } = await supabase.storage.from('flugspuren').remove([file.name]);
      if (error) alert('Fehler: ' + error.message);
      else listSupabaseFiles();
    };

    row.appendChild(name);
    row.appendChild(delBtn);
    list.appendChild(row);
  });
  if (!data?.length) list.innerHTML = '<p style="color:var(--text-dim);font-size:0.85rem;padding:8px">Keine Dateien gefunden.</p>';
}

async function uploadCurrent(filename) {
  if (!originalKmlContent) return;
  const blob = new Blob([buildKml()], { type: 'application/vnd.google-earth.kml+xml' });
  const file = new File([blob], filename);
  const { error } = await supabase.storage.from('flugspuren').upload(filename, file, { upsert: true });
  if (error) alert('Upload fehlgeschlagen: ' + error.message);
  else alert('Gespeichert: ' + filename);
}

// ═══════════════════════════════════════════════════════
//  KML EXPORT
// ═══════════════════════════════════════════════════════
function buildKml() {
  let kml = `<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2">\n  <Document>\n`;
  for (const p of fullCoords) {
    if (!Number.isInteger(p.seconds)) continue;
    kml += `    <Placemark>\n      <name>${fmtTime(p.seconds)}</name>\n      <Point>\n        <coordinates>${p.lon},${p.lat},${p.alt}</coordinates>\n      </Point>\n    </Placemark>\n`;
  }
  return kml + `  </Document>\n</kml>`;
}

function saveLocal() {
  if (!fullCoords.length) { alert('Keine Daten.'); return; }
  const blob = new Blob([buildKml()], { type: 'application/vnd.google-earth.kml+xml' });
  const a    = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: (originalFileName || 'flugroute').replace('.kml', '_export.kml') });
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

// ═══════════════════════════════════════════════════════
//  CHART RESIZE (drag handle)
// ═══════════════════════════════════════════════════════
const chartPanel = document.getElementById('chartPanel');
const handle     = document.getElementById('chartHandle');
let resizing     = false, resizeStartY = 0, resizeStartH = 0;

handle.addEventListener('pointerdown', e => {
  resizing = true; resizeStartY = e.clientY; resizeStartH = chartPanel.offsetHeight;
  handle.setPointerCapture(e.pointerId);
});
handle.addEventListener('pointermove', e => {
  if (!resizing) return;
  const delta  = resizeStartY - e.clientY;
  const newH   = Math.max(80, Math.min(window.innerHeight * 0.7, resizeStartH + delta));
  chartPanel.style.height = newH + 'px';
});
handle.addEventListener('pointerup', () => { resizing = false; });

// ═══════════════════════════════════════════════════════
//  BUTTON HANDLERS
// ═══════════════════════════════════════════════════════
document.getElementById('togglePlayBtn').onclick = () => {
  if (!fullCoords.length) return;
  if (isPlaying) pauseAnimation(); else startAnimation();
};

document.getElementById('trailSlider').oninput = e => { trailSeconds = parseInt(e.target.value); };

document.getElementById('switchView').onclick = () => {
  is3D = !is3D;
  scene.mode = is3D ? Cesium.SceneMode.SCENE2D : Cesium.SceneMode.SCENE3D;
  document.getElementById('switchView').textContent = is3D ? '3D' : '2D';
  if (!is3D) Cesium.createWorldTerrainAsync().then(t => viewer.terrainProvider = t);
  if (!followEnabled) {
    controller.enableTranslate = true;
  } else {
    controller.enableTranslate = !is3D;
  }
};

document.getElementById('openFile').onclick = () => {
  document.getElementById('fileOptionsOverlay').classList.add('open');
};

document.getElementById('fileOptionsCancel').onclick = () => {
  document.getElementById('fileOptionsOverlay').classList.remove('open');
};

document.getElementById('loadLocalBtn').onclick = () => {
  document.getElementById('fileOptionsOverlay').classList.remove('open');
  setTimeout(() => {
    const fi = document.getElementById('fileInput');
    fi.value = '';
    fi.click();
  }, 100);
};

document.getElementById('loadServerBtn').onclick = () => {
  document.getElementById('fileOptionsOverlay').classList.remove('open');
  document.getElementById('serverFileOverlay').classList.add('open');
  listSupabaseFiles();
};

document.getElementById('serverFileCancel').onclick = () => {
  document.getElementById('serverFileOverlay').classList.remove('open');
};

document.getElementById('uploadServerBtn').onclick = () => {
  document.getElementById('fileOptionsOverlay').classList.remove('open');
  const input = document.createElement('input');
  input.type   = 'file';
  input.accept = '.kml';
  input.onchange = async e => {
    const file = e.target.files[0];
    if (!file) return;
    const name = prompt('Dateiname:', file.name) || file.name;
    showLoading(true);
    const { error } = await supabase.storage.from('flugspuren').upload(name, new File([file], name, { type: file.type }), { upsert: true });
    showLoading(false);
    if (error) alert('Fehler: ' + error.message);
    else alert('Hochgeladen: ' + name);
  };
  input.click();
};

document.getElementById('saveLocalBtn').onclick = () => {
  document.getElementById('fileOptionsOverlay').classList.remove('open');
  saveLocal();
};

document.getElementById('fileInput').addEventListener('change', e => {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => loadKmlText(ev.target.result, file.name);
  reader.readAsText(file);
});

document.getElementById('toggleFollow').onclick = () => {
  followEnabled = !followEnabled;
  document.getElementById('toggleFollow').classList.toggle('active', followEnabled);
  document.getElementById('toggleFollow').textContent = followEnabled ? '👁' : '👁';
  if (!followEnabled) stopFollow();
  else if (fullCoords.length) updatePoint(animationIndex);
};

const speedValues = [1, 2, 4, 8, 16];
let speedIdx = 0;
document.getElementById('speedBtn').onclick = () => {
  speedIdx = (speedIdx + 1) % speedValues.length;
  speedFactor = speedValues[speedIdx];
  document.getElementById('speedBtn').textContent = speedFactor + '×';
};

document.getElementById('fullscreenBtn').onclick = () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
  else document.exitFullscreen();
};

document.getElementById('cutModeBtn').onclick = () => {
  if (!cutModeActive) activateCutMode();
  else applyCut();
};

document.getElementById('cutUploadYes').onclick = async () => {
  document.getElementById('cutUploadOverlay').classList.remove('open');
  const name = prompt('Dateiname:', (originalFileName || 'cut').replace('.kml', '_geschnitten.kml'));
  if (name) await uploadCurrent(name);
};
document.getElementById('cutUploadNo').onclick = () => {
  document.getElementById('cutUploadOverlay').classList.remove('open');
  saveLocal();
};

// ═══════════════════════════════════════════════════════
//  UTILS
// ═══════════════════════════════════════════════════════
function fmtTime(sec) {
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = Math.floor(sec % 60);
  return h > 0
    ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`
    : `${m}:${String(s).padStart(2,'0')}`;
}

function showLoading(on) {
  const bar = document.getElementById('loadingBar');
  bar.style.display = on ? 'block' : 'none';
  bar.style.width   = on ? '70%' : '100%';
  if (!on) setTimeout(() => { bar.style.display = 'none'; }, 300);
}
